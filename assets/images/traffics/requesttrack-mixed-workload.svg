<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #f6f4ef; }
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .sub { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .text { font: 400 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 13px Arial, sans-serif; fill: #374151; }
      .box { rx: 18; ry: 18; stroke-width: 2; }
      .pool { fill: #ffffff; stroke: #1f2937; }
      .req { fill: #e7f4e8; stroke: #3f7d58; }
      .staff { fill: #e7eefb; stroke: #3d5a98; }
      .cleanup { fill: #fdeccf; stroke: #b7791f; }
      .mix { fill: #fdfdfd; stroke: #44403c; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <text class="title" x="50" y="52">Request Tracker Mixed Workload Topology</text>
  <text class="sub" x="50" y="80">K6 builds a role-based workload: requester pool, staff pool, and late-window cleanup pool.</text>

  <rect class="box mix" x="410" y="110" width="380" height="120"/>
  <text class="label" x="505" y="150">Mixed Entry Script</text>
  <text class="text" x="455" y="178">`rt_mix.js` imports all atomic scenarios</text>
  <text class="text" x="455" y="202">and dispatches them by role pool weights.</text>

  <rect class="box pool" x="450" y="280" width="300" height="90"/>
  <text class="label" x="518" y="320">Shared Inputs</text>
  <text class="text" x="500" y="346">RT tokens from `k6-rt-users.yaml`</text>

  <rect class="box req" x="70" y="430" width="300" height="220"/>
  <text class="label" x="145" y="468">Requester Pool</text>
  <text class="small" x="98" y="498">Weights: `W_REQ_BROWSEOWN`, `W_REQ_FOLLOWUP`, `W_REQ_INTAKE`</text>
  <text class="text" x="110" y="540">R1 Intake</text>
  <text class="text" x="110" y="570">R2 Browse Own</text>
  <text class="text" x="110" y="600">R3 Follow-up</text>
  <text class="small" x="110" y="630">Role pattern: create, read own tickets, add follow-up</text>

  <rect class="box staff" x="450" y="410" width="300" height="260"/>
  <text class="label" x="544" y="448">Staff Pool</text>
  <text class="small" x="484" y="478">Weights: triage, notes, update, workflow, handoff, lifecycle</text>
  <text class="text" x="490" y="518">S1 Triage</text>
  <text class="text" x="490" y="544">S2 Notes</text>
  <text class="text" x="490" y="570">U1 Update / Modify</text>
  <text class="text" x="490" y="596">S3 Workflow</text>
  <text class="text" x="490" y="622">X1 End-to-End Handoff</text>
  <text class="text" x="490" y="648">S4 Lifecycle</text>

  <rect class="box cleanup" x="830" y="455" width="290" height="150"/>
  <text class="label" x="901" y="495">Cleanup Pool</text>
  <text class="text" x="878" y="530">S5 Cleanup Delete</text>
  <text class="small" x="860" y="560">Starts late in the run</text>
  <text class="small" x="860" y="582">Typical window: `50m` to `55m`</text>

  <rect class="box pool" x="860" y="130" width="270" height="180"/>
  <text class="label" x="910" y="168">Hourly Cron Profiles</text>
  <text class="text" x="890" y="205">Low: 1 requester, 1 staff, 1 cleanup</text>
  <text class="text" x="890" y="232">Normal: 2 requesters, 3 staff, 1 cleanup</text>
  <text class="text" x="890" y="259">Peak: 3 requesters, 6 staff, 1 cleanup</text>
  <text class="small" x="890" y="288">Weights and thresholds change by profile.</text>

  <path class="arrow" d="M600 230 L600 280"/>
  <path class="arrow" d="M520 370 L250 430"/>
  <path class="arrow" d="M600 370 L600 410"/>
  <path class="arrow" d="M690 370 L930 455"/>
  <path class="arrow" d="M790 170 L860 170"/>
  <path class="arrow" d="M975 310 L975 455"/>

  <text class="small" x="70" y="715">Mixed execution uses an initContainer to assemble scripts and patch environment-name collisions before `k6 run ./rt_mix.js`.</text>
</svg>
