apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-wiki-pagesearch-env
  namespace: traffic
data:
  # ========= Target =========
  BASE_URL: "https://wiki.example.com"
  GRAPHQL_PATH: "/graphql"
  INSECURE_TLS: "true"

  # ========= User model (stable online users) =========
  VUS: "4"
  DURATION: "5m"

  # ========= Human pacing =========
  THINK_MIN_MS: "200"
  THINK_MAX_MS: "1200"

  # ========= Search shape =========
  LOCALE: "en"
  # path is one of the parameters in Wiki.js pages.search examples; if you want a global search, an empty string is usually enough
  SEARCH_PATH: ""
  # Multiple search terms: comma-separated; k6 picks one at random on each iteration
  SEARCH_TERMS: "code,markdown,gitea,deploy,k3s,redis,mysql"
  # Returned result fields & row-count control (only affects response size, not necessarily backend search latency)
  RESULT_LIMIT: "10"

  # ========= HTTP =========
  TIMEOUT: "30s"

  # ========= Thresholds =========
  FAIL_RATE_MAX: "0.01"
  P95_MS_MAX: "1500"
