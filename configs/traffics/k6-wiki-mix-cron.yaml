apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-wiki-mixed-cron
  namespace: traffic
spec:
  schedule: "0 * * * *"              # Run once every hour
  concurrencyPolicy: Forbid          # Do not start the next run until the previous one finishes
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 4200    # 70m, leaving buffer for a 55m run
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role: worker

          volumes:
            - name: scripts
              emptyDir: {}
            - name: k6-logs
              persistentVolumeClaim:
                claimName: k6-logs-pvc

            # Project the entry script plus 6 sub-scenario scripts into one directory (more like "packaging")
            - name: cm-all
              projected:
                sources:
                  - configMap:
                      name: k6-wiki-mixed-script
                      items:
                        - key: wiki_mixed.js
                          path: wiki_mixed.js
                  - configMap:
                      name: k6-wiki-pagecreate-script
                      items:
                        - key: page_create.js
                          path: page_create.js
                  - configMap:
                      name: k6-wiki-pageupdate-script
                      items:
                        - key: page_update.js
                          path: page_update.js
                  - configMap:
                      name: k6-wiki-pagedelete-script
                      items:
                        - key: page_delete.js
                          path: page_delete.js
                  - configMap:
                      name: k6-wiki-pageslist-script
                      items:
                        - key: pages_list.js
                          path: pages_list.js
                  - configMap:
                      name: k6-wiki-pageread-script
                      items:
                        - key: page_read.js
                          path: page_read.js
                  - configMap:
                      name: k6-wiki-pagesearch-script
                      items:
                        - key: page_search.js
                          path: page_search.js

          initContainers:
            - name: assemble-scripts
              image: rancher/mirrored-library-busybox:1.36.1
              command: ["/bin/sh","-c"]
              args:
                - |
                  set -e
                  mkdir -p /scripts
                  cp -a /cm/. /scripts/
                  ls -lah /scripts
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: cm-all
                  mountPath: /cm
                  readOnly: true

          containers:
            - name: k6
              image: zot.example.com/mirror/ghcr.io/grafana/k6
              imagePullPolicy: IfNotPresent

              command: ["/bin/sh","-ceu"]
              args:
                - |
                  # -------- time & run_id (use UTC) --------
                  hour="$(date -u +%H)"
                  day="$(date -u +%Y%m%d)"
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"

                  in_list() { x="$1"; shift; for a in "$@"; do [ "$a" = "$x" ] && return 0; done; return 1; }

                  LOW_HOURS="${LOW_HOURS:-00 01 02 03 04 05 06 07 08 21 22 23}"
                  PEAK_HOURS="${PEAK_HOURS:-09 10 11 14 15 16 17}"

                  if in_list "$hour" $PEAK_HOURS; then
                    PROFILE="peak"
                  elif in_list "$hour" $LOW_HOURS; then
                    PROFILE="low"
                  else
                    PROFILE="normal"
                  fi
                  export PROFILE

                  # -------- apply params --------
                  apply_low() {
                    export DURATION="55m"
                    export TOTAL_VUS="4"
                    # Read-heavy; keep each write scenario at least 1 VU (avoids producing zero write traffic)
                    export VUS_CREATE="1" VUS_UPDATE="1" VUS_DELETE="1"
                    export W_READ="60" W_SEARCH="25" W_LIST="15"
                    export W_CREATE="0" W_UPDATE="0" W_DELETE="0"
                    export TH_FAIL_RATE_MAX="0.10" TH_P95_MS_MAX="5000" TH_CHECKS_MIN="0.90"
                  }

                  apply_normal() {
                    export DURATION="55m"
                    export TOTAL_VUS="6"
                    export VUS_CREATE="1" VUS_UPDATE="1" VUS_DELETE="1"
                    export W_READ="55" W_SEARCH="30" W_LIST="15"
                    export W_CREATE="0" W_UPDATE="0" W_DELETE="0"
                    export TH_FAIL_RATE_MAX="0.05" TH_P95_MS_MAX="3000" TH_CHECKS_MIN="0.95"
                  }

                  apply_peak() {
                    export DURATION="55m"
                    export TOTAL_VUS="10"
                    export VUS_CREATE="1" VUS_UPDATE="1" VUS_DELETE="1"
                    export W_READ="45" W_SEARCH="35" W_LIST="20"
                    export W_CREATE="0" W_UPDATE="0" W_DELETE="0"
                    export TH_FAIL_RATE_MAX="0.08" TH_P95_MS_MAX="4500" TH_CHECKS_MIN="0.93"
                  }

                  case "$PROFILE" in
                    low)    apply_low ;;
                    normal) apply_normal ;;
                    peak)   apply_peak ;;
                    *)      apply_normal ;;
                  esac

                  # -------- per-run run_id + restrict write ops to this run --------
                  run_id="${PROFILE}-${JOB_NAME:-job}-${POD_NAME:-pod}-${ts}"
                  export CREATE_RUN_ID="$run_id"
                  export REQUIRE_RUN_ID="$run_id"
                  export DELETE_RUN_ID="$run_id"

                  # -------- delete shard compatibility: page_delete.js initializes shards from __ENV.VUS, so force it to match delete concurrency --------
                  export VUS="${VUS_DELETE:-1}"

                  # -------- optional: enable dynamic discover (if your scripts support these flags) --------
                  export UPDATE_DYNAMIC_DISCOVER="${UPDATE_DYNAMIC_DISCOVER:-true}"
                  export UPDATE_DISCOVER_EVERY="${UPDATE_DISCOVER_EVERY:-5}"
                  export DELETE_DYNAMIC_DISCOVER="${DELETE_DYNAMIC_DISCOVER:-true}"
                  export DELETE_DISCOVER_EVERY="${DELETE_DISCOVER_EVERY:-5}"

                  # -------- output path (PVC) --------
                  out="/logs/wiki/${PROFILE}/${day}"
                  mkdir -p "$out"

                  echo "[runner] hour=${hour} profile=${PROFILE} run_id=${run_id}"
                  echo "[runner] output=${out}"

                  env | egrep '^(PROFILE|DURATION|TOTAL_VUS|VUS=|VUS_|W_|TH_|CREATE_RUN_ID|REQUIRE_RUN_ID|DELETE_RUN_ID|UPDATE_DYNAMIC_DISCOVER|UPDATE_DISCOVER_EVERY|DELETE_DYNAMIC_DISCOVER|DELETE_DISCOVER_EVERY)=' \
                    > "${out}/env-${run_id}.txt"

                  k6 run /scripts/wiki_mixed.js \
                    --tag run_id="${run_id}" \
                    --tag profile="${PROFILE}" \
                    --tag hour="${hour}" \
                    --summary-export "${out}/summary-${run_id}.json" \
                    2>&1 | tee "${out}/run-${run_id}.log"

              env:
                - name: LOW_HOURS
                  value: "00 01 02 03 04 05 06 07 08 12 13 21 22 23"
                - name: PEAK_HOURS
                  value: "17 18"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']

              # It is recommended to keep Base (fixed items) in a single "mixed env ConfigMap"; here we reuse the existing k6-wiki-mixed-env via envFrom
              envFrom:
                - configMapRef:
                    name: k6-wiki-mixed-env

              env:
                - name: WIKI_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: k6-wiki-secret
                      key: WIKI_TOKEN

              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: k6-logs
                  mountPath: /logs

              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
