apiVersion: batch/v1
kind: Job
metadata:
  name: k6-zot-blobs-job
  namespace: traffic
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: zot.example.com/mirror/ghcr.io/grafana/k6
          command: ["k6", "run", "/scripts/blobs.js"]
          env:
            - name: BASE_URL
              value: "https://zot.example.com"
            - name: INSECURE_TLS
              value: "true"
            - name: ZOT_USER
              valueFrom: { secretKeyRef: { name: k6-zot-secret, key: username } }
            - name: ZOT_PASS
              valueFrom: { secretKeyRef: { name: k6-zot-secret, key: password } }
            - name: ITERATIONS
              value: "3"
            - name: REPO
              value: "mirror/docker.io/library/nginx"
            - name: TAG
              value: "1.27"
            - name: MANIFEST_GET_PCT
              value: "100"
            - name: BLOB_GET_PCT
              value: "90"
            - name: BLOB_PARALLELISM
              value: "2"
            - name: PULL_FULL_PCT
              value: "0"
            - name: LAYER_SAMPLE_MIN
              value: "1"
            - name: LAYER_SAMPLE_MAX
              value: "2"
          resources:
            requests: { cpu: "300m", memory: "384Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          projected:
            sources:
              - configMap: { name: k6-zot-lib,      items: [{ key: lib.js,      path: lib.js }] }
              - configMap: { name: k6-zot-manifest, items: [{ key: manifest.js, path: manifest.js }] }
              - configMap: { name: k6-zot-blobs,    items: [{ key: blobs.js,    path: blobs.js }] }
