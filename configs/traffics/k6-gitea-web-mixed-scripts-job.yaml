apiVersion: batch/v1
kind: Job
metadata:
  name: k6-gitea-web-mixed-job
  namespace: traffic
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: assemble-scripts
          image: rancher/mirrored-library-busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /scripts/browse /scripts/review /scripts/issues /scripts/commit
              cp -a /cm/browse/. /scripts/browse/
              cp -a /cm/review/. /scripts/review/
              cp -a /cm/issues/. /scripts/issues/
              cp -a /cm/commit/. /scripts/commit/
              cp -a /cm/mix/. /scripts/
              ls -lah /scripts /scripts/browse /scripts/review /scripts/issues /scripts/commit
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: cm-browse
              mountPath: /cm/browse
              readOnly: true
            - name: cm-review
              mountPath: /cm/review
              readOnly: true
            - name: cm-issues
              mountPath: /cm/issues
              readOnly: true
            - name: cm-commit
              mountPath: /cm/commit
              readOnly: true
            - name: cm-mix
              mountPath: /cm/mix
              readOnly: true

      containers:
        - name: k6
          image: grafana/k6:0.49.0
          imagePullPolicy: IfNotPresent

          # Wrap it with a shell layer to generate a unique run_id and write summary/log to the PVC
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              run_id="${JOB_NAME:-job}-${POD_NAME:-pod}-${ts}"

              mkdir -p /logs
              echo "[runner] run_id=${run_id}"
              echo "[runner] exporting to /logs"

              k6 run /scripts/web_mix.js \
                --tag run_id="${run_id}" \
                --summary-export "/logs/summary-${run_id}.json" \
                2>&1 | tee "/logs/run-${run_id}.log"

          env:
            # Used to generate a unique filename (Downward API)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']

            # =========================
            # Base (all scripts)
            # =========================
            - name: BASE_URL
              value: "https://gitea.example.com"
            - name: INSECURE_TLS
              value: "true"
            - name: REPO
              value: "nixwl/tquic"
            - name: BRANCH
              value: ""
            - name: DURATION
              value: "10m"
            - name: SLEEP_SECONDS
              value: "1"

            # =========================
            # Secret (web login / API)
            # =========================
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k6-gitea-secret
                  key: token
            - name: GITEA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k6-gitea-secret
                  key: username
            - name: GITEA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k6-gitea-secret
                  key: password

            # =========================
            # Mix (web_mix.js)
            # =========================
            - name: TOTAL_VUS
              value: "20"
            - name: VUS
              value: "20"
            - name: W_BROWSE
              value: "50"
            - name: W_REVIEW
              value: "20"
            - name: W_ISSUES
              value: "20"
            - name: W_COMMIT
              value: "10"

            # =========================
            # Thresholds (all jobs)
            # =========================
            - name: TH_FAIL_RATE_MAX
              value: "0.05"
            - name: TH_P95_MS_MAX
              value: "3000"
            - name: TH_CHECKS_MIN
              value: "0.95"

            # =========================
            # Browse-specific
            # =========================
            - name: EXPLORE_PAGES
              value: "2"
            - name: ENABLE_REPO_HOME
              value: "true"
            - name: ENABLE_ISSUES
              value: "true"
            - name: ENABLE_PULLS
              value: "true"
            - name: ENABLE_COMMITS
              value: "true"

            # =========================
            # Issues-specific
            # =========================
            - name: ISSUES_PAGES
              value: "2"
            - name: ENABLE_LABELS
              value: "true"
            - name: ENABLE_MILESTONES
              value: "true"

            # =========================
            # Review-specific
            # =========================
            - name: REPO_FILE_PATH
              value: ""
            - name: ENABLE_BLAME
              value: "false"

            # =========================
            # Commit-specific
            # =========================
            - name: REDIRECTS
              value: "5"

            - name: TIMEOUT_SECONDS
              value: "10"
            - name: COMMIT_DETAIL_TIMEOUT_SECONDS
              value: "20"
            - name: COMMIT_DETAIL_RETRIES
              value: "1"
            - name: COMMIT_DETAIL_RETRY_SLEEP_SECONDS
              value: "0.2"
            - name: ALLOW_404_FOR_OPTIONAL
              value: "true"
            - name: ALLOW_TIMEOUT_FOR_OPTIONAL
              value: "false"

            - name: ENABLE_HOME
              value: "true"
            - name: ENABLE_COMMITS_LIST
              value: "true"
            - name: COMMITS_PAGES
              value: "2"

            - name: ENABLE_COMMIT_DETAIL
              value: "true"
            - name: COMMIT_DETAIL_PROB
              value: "1.0"
            - name: COMMIT_DIFF_MODE
              value: "split" # split|unified|random

            - name: ENABLE_COMMIT_DIFF
              value: "true"
            - name: COMMIT_DIFF_PROB
              value: "1.0"

            - name: ENABLE_COMMIT_PATCH
              value: "false"
            - name: COMMIT_PATCH_PROB
              value: "0.2"

            - name: ENABLE_PATH_COMMITS
              value: "true"
            - name: PATH_COMMITS_PROB
              value: "0.5"

            - name: ENABLE_FILE_AT_COMMIT
              value: "true"
            - name: FILE_AT_COMMIT_PROB
              value: "0.5"

            - name: HEAVY_EXTRA_SLEEP_SECONDS
              value: "0"

            - name: API_COMMITS_LIMIT
              value: "30"
            - name: API_FILES_LIMIT
              value: "50"
            - name: ENABLE_HTML_SHA_FALLBACK
              value: "true"
            - name: HTML_SHA_FALLBACK_LIMIT
              value: "10"

          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: k6-logs
              mountPath: /logs

      volumes:
        - name: scripts
          emptyDir: {}
        - name: k6-logs
          persistentVolumeClaim:
            claimName: k6-logs-pvc
        - name: cm-browse
          configMap:
            name: k6-gitea-web-browse-scripts
        - name: cm-review
          configMap:
            name: k6-gitea-web-review-scripts
        - name: cm-issues
          configMap:
            name: k6-gitea-web-issues-scripts
        - name: cm-commit
          configMap:
            name: k6-gitea-web-commit-scripts
        - name: cm-mix
          configMap:
            name: k6-gitea-web-mix-scripts
