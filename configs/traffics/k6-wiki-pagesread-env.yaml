apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-wiki-pageread-env
  namespace: traffic
data:
  # ========= Target =========
  BASE_URL: "https://wiki.example.com"
  GRAPHQL_PATH: "/graphql"
  INSECURE_TLS: "true"

  # ========= User model (stable online users) =========
  VUS: "4"
  DURATION: "5m"

  # ========= Human pacing =========
  THINK_MIN_MS: "500"
  THINK_MAX_MS: "2500"

  # ========= Page pool (from pages.list in setup) =========
  # 0 means unlimited (by default the full list is fetched and sampled in memory)
  POOL_LIMIT: "0"

  # ========= Query shape =========
  LOCALE: "en"
  ORDER_BY: "TITLE"

  # ========= Read payload shape =========
  READ_INCLUDE_CONTENT: "true"
  READ_INCLUDE_RENDER: "true"
  READ_INCLUDE_TOC: "true"
  READ_INCLUDE_DESCRIPTION: "true"

  # ========= HTTP =========
  TIMEOUT: "30s"

  # ========= Thresholds =========
  FAIL_RATE_MAX: "0.01"
  P95_MS_MAX: "2000"
