apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-wiki-pagedelete-env
  namespace: traffic
data:
  BASE_URL: "https://wiki.example.com"
  GRAPHQL_PATH: "/graphql"
  INSECURE_TLS: "true"

  VUS: "1"
  LIMIT_PER_VU: "20"
  MAX_DURATION: "10m"

  # ========= Safety guard =========
  # Only delete pages whose path starts with this prefix
  DELETE_PATH_PREFIX: "k6/create" # ✅ Added: satisfies the script's mustEnv requirement
  DELETE_PREFIX: "k6/create" # Optional: keep or remove; useful if the script adds compatibility later

  # ✅ Disable strict run_id protection: auto-discover deletes using only prefix + title filters
  DELETE_RUN_ID: ""
  REQUIRE_RUN_ID: "false"

  TITLE_PREFIX: "k6 created"
  LOCALE: "en"
  DRY_RUN: "false"

  THINK_MIN_MS: "200"
  THINK_MAX_MS: "800"

  TIMEOUT: "30s"
  FAIL_RATE_MAX: "0.01"
  P95_MS_MAX: "10000"
