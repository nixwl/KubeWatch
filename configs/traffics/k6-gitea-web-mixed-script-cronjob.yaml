apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-gitea-web-mixed-cron
  namespace: traffic
spec:
  schedule: "0 * * * *" # Run once every hour
  concurrencyPolicy: Forbid # Do not start the next run until the previous one finishes
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 4200 # 55m = 3300s, leaving enough buffer
      ttlSecondsAfterFinished: 3600 # Optional: clean up the Job object after 1 hour (PVC files are unaffected)

      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: assemble-scripts
              image: rancher/mirrored-library-busybox:1.36.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p /scripts/browse /scripts/review /scripts/issues /scripts/commit
                  cp -a /cm/browse/. /scripts/browse/
                  cp -a /cm/review/. /scripts/review/
                  cp -a /cm/issues/. /scripts/issues/
                  cp -a /cm/commit/. /scripts/commit/
                  cp -a /cm/mix/. /scripts/
                  ls -lah /scripts /scripts/browse /scripts/review /scripts/issues /scripts/commit
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: cm-browse
                  mountPath: /cm/browse
                  readOnly: true
                - name: cm-review
                  mountPath: /cm/review
                  readOnly: true
                - name: cm-issues
                  mountPath: /cm/issues
                  readOnly: true
                - name: cm-commit
                  mountPath: /cm/commit
                  readOnly: true
                - name: cm-mix
                  mountPath: /cm/mix
                  readOnly: true

          containers:
            - name: k6
              image: grafana/k6:0.49.0
              imagePullPolicy: IfNotPresent

              command: ["/bin/sh", "-ceu"]
              args:
                - |
                  # -------- time & run_id --------
                  hour="$(date +%H)"
                  day="$(date +%Y%m%d)"
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"

                  # -------- choose profile by hour --------
                  in_list() { x="$1"; shift; for a in "$@"; do [ "$a" = "$x" ] && return 0; done; return 1; }

                  # You can adjust these two env vars to change the time windows
                  LOW_HOURS="${LOW_HOURS:-00 01 02 03 04 05 06 07 08 12 13 21 22 23}"
                  PEAK_HOURS="${PEAK_HOURS:-17 18}"

                  if in_list "$hour" $PEAK_HOURS; then
                    PROFILE="peak"
                  elif in_list "$hour" $LOW_HOURS; then
                    PROFILE="low"
                  else
                    PROFILE="normal"
                  fi

                  export PROFILE

                  # -------- apply params --------
                  apply_low() {
                    export DURATION="55m" SLEEP_SECONDS="4"
                    export TOTAL_VUS="2" VUS="2"
                    export W_BROWSE="70" W_REVIEW="10" W_ISSUES="15" W_COMMIT="5"
                    export TH_FAIL_RATE_MAX="0.10" TH_P95_MS_MAX="5000" TH_CHECKS_MIN="0.90"
                    export EXPLORE_PAGES="1" ISSUES_PAGES="1" COMMITS_PAGES="1"
                    export ENABLE_MILESTONES="false" ENABLE_BLAME="false"
                    export TIMEOUT_SECONDS="12" COMMIT_DETAIL_TIMEOUT_SECONDS="20"
                    export COMMIT_DETAIL_RETRIES="1" COMMIT_DETAIL_RETRY_SLEEP_SECONDS="0.3"
                    export ALLOW_TIMEOUT_FOR_OPTIONAL="true"
                    export COMMIT_DETAIL_PROB="0.3" COMMIT_DIFF_PROB="0.3" COMMIT_DIFF_MODE="random"
                    export PATH_COMMITS_PROB="0.2" FILE_AT_COMMIT_PROB="0.2"
                    export ENABLE_COMMIT_PATCH="false" COMMIT_PATCH_PROB="0.1"
                    export HEAVY_EXTRA_SLEEP_SECONDS="1"
                    export API_COMMITS_LIMIT="15" API_FILES_LIMIT="30" HTML_SHA_FALLBACK_LIMIT="5"
                  }

                  apply_normal() {
                    export DURATION="55m" SLEEP_SECONDS="2"
                    export TOTAL_VUS="6" VUS="6"
                    export W_BROWSE="55" W_REVIEW="20" W_ISSUES="20" W_COMMIT="5"
                    export TH_FAIL_RATE_MAX="0.05" TH_P95_MS_MAX="3000" TH_CHECKS_MIN="0.95"
                    export EXPLORE_PAGES="2" ISSUES_PAGES="2" COMMITS_PAGES="2"
                    export ENABLE_MILESTONES="true" ENABLE_BLAME="false"
                    export TIMEOUT_SECONDS="10" COMMIT_DETAIL_TIMEOUT_SECONDS="20"
                    export COMMIT_DETAIL_RETRIES="1" COMMIT_DETAIL_RETRY_SLEEP_SECONDS="0.2"
                    export ALLOW_TIMEOUT_FOR_OPTIONAL="false"
                    export COMMIT_DETAIL_PROB="0.6" COMMIT_DIFF_PROB="0.6" COMMIT_DIFF_MODE="random"
                    export PATH_COMMITS_PROB="0.4" FILE_AT_COMMIT_PROB="0.4"
                    export ENABLE_COMMIT_PATCH="false" COMMIT_PATCH_PROB="0.2"
                    export HEAVY_EXTRA_SLEEP_SECONDS="0.3"
                    export API_COMMITS_LIMIT="30" API_FILES_LIMIT="50" HTML_SHA_FALLBACK_LIMIT="10"
                  }

                  apply_peak() {
                    export DURATION="55m" SLEEP_SECONDS="1"
                    export TOTAL_VUS="10" VUS="10"
                    export W_BROWSE="40" W_REVIEW="30" W_ISSUES="20" W_COMMIT="10"
                    export TH_FAIL_RATE_MAX="0.08" TH_P95_MS_MAX="4500" TH_CHECKS_MIN="0.93"
                    export EXPLORE_PAGES="3" ISSUES_PAGES="3" COMMITS_PAGES="3"
                    export ENABLE_MILESTONES="true" ENABLE_BLAME="true"
                    export TIMEOUT_SECONDS="12" COMMIT_DETAIL_TIMEOUT_SECONDS="25"
                    export COMMIT_DETAIL_RETRIES="2" COMMIT_DETAIL_RETRY_SLEEP_SECONDS="0.2"
                    export ALLOW_TIMEOUT_FOR_OPTIONAL="false"
                    export COMMIT_DETAIL_PROB="1.0" COMMIT_DIFF_PROB="1.0" COMMIT_DIFF_MODE="random"
                    export PATH_COMMITS_PROB="0.6" FILE_AT_COMMIT_PROB="0.6"
                    export ENABLE_COMMIT_PATCH="true" COMMIT_PATCH_PROB="0.3"
                    export HEAVY_EXTRA_SLEEP_SECONDS="0.1"
                    export API_COMMITS_LIMIT="50" API_FILES_LIMIT="80" HTML_SHA_FALLBACK_LIMIT="15"
                  }

                  case "$PROFILE" in
                    low)    apply_low ;;
                    normal) apply_normal ;;
                    peak)   apply_peak ;;
                    *)      apply_normal ;;
                  esac

                  # -------- output path (PVC) --------
                  run_id="${PROFILE}-${JOB_NAME:-job}-${POD_NAME:-pod}-${ts}"
                  out="/logs/gitea/web/${PROFILE}/${day}"
                  mkdir -p "$out"

                  echo "[runner] hour=${hour} profile=${PROFILE} run_id=${run_id}"
                  echo "[runner] output=${out}"

                  env | egrep '^(PROFILE|DURATION|SLEEP_SECONDS|TOTAL_VUS|VUS|W_|TH_|EXPLORE_PAGES|ISSUES_PAGES|COMMITS_PAGES|COMMIT_.*_PROB|PATH_COMMITS_PROB|FILE_AT_COMMIT_PROB|HEAVY_EXTRA_SLEEP_SECONDS|API_.*_LIMIT|HTML_SHA_FALLBACK_LIMIT|TIMEOUT_SECONDS|COMMIT_DETAIL_TIMEOUT_SECONDS|ALLOW_TIMEOUT_FOR_OPTIONAL|ENABLE_BLAME|ENABLE_MILESTONES)=' \
                    > "${out}/env-${run_id}.txt"

                  k6 run /scripts/web_mix.js \
                    --tag run_id="${run_id}" \
                    --tag profile="${PROFILE}" \
                    --tag hour="${hour}" \
                    --summary-export "${out}/summary-${run_id}.json" \
                    2>&1 | tee "${out}/run-${run_id}.log"

              env:
                - name: LOW_HOURS
                  value: "00 01 02 03 04 05 06 07 08 12 13 21 22 23"
                - name: PEAK_HOURS
                  value: "17 18"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']

                # Base (fixed items)
                - name: BASE_URL
                  value: "https://gitea.example.com"
                - name: INSECURE_TLS
                  value: "true"
                - name: REPO
                  value: "nixwl/tquic"
                - name: BRANCH
                  value: ""

                - name: ENABLE_REPO_HOME
                  value: "true"
                - name: ENABLE_ISSUES
                  value: "true"
                - name: ENABLE_PULLS
                  value: "true"
                - name: ENABLE_COMMITS
                  value: "true"

                - name: REDIRECTS
                  value: "5"
                - name: ALLOW_404_FOR_OPTIONAL
                  value: "true"
                - name: ENABLE_HOME
                  value: "true"
                - name: ENABLE_COMMITS_LIST
                  value: "true"
                - name: ENABLE_COMMIT_DETAIL
                  value: "true"
                - name: ENABLE_COMMIT_DIFF
                  value: "true"
                - name: ENABLE_PATH_COMMITS
                  value: "true"
                - name: ENABLE_FILE_AT_COMMIT
                  value: "true"
                - name: ENABLE_HTML_SHA_FALLBACK
                  value: "true"
                - name: REPO_FILE_PATH
                  value: ""

                # Secret (Web login / API)
                - name: GITEA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: k6-gitea-secret
                      key: token
                - name: GITEA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: k6-gitea-secret
                      key: username
                - name: GITEA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: k6-gitea-secret
                      key: password

              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: k6-logs
                  mountPath: /logs

          volumes:
            - name: scripts
              emptyDir: {}
            - name: k6-logs
              persistentVolumeClaim:
                claimName: k6-logs-pvc
            - name: cm-browse
              configMap:
                name: k6-gitea-web-browse-scripts
            - name: cm-review
              configMap:
                name: k6-gitea-web-review-scripts
            - name: cm-issues
              configMap:
                name: k6-gitea-web-issues-scripts
            - name: cm-commit
              configMap:
                name: k6-gitea-web-commit-scripts
            - name: cm-mix
              configMap:
                name: k6-gitea-web-mix-scripts
