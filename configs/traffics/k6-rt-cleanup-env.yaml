apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-rt-cleanup-env
  namespace: traffic
data:
  BASE_URL: "https://rt.example.com"
  INSECURE_TLS: "true"
  RT_QUEUE: "Traffic"

  # ===== root-only: must run single-threaded =====
  VUS: "1"
  DURATION: "5m"
  SLEEP_MIN: "0.2"
  SLEEP_MAX: "0.8"

  # Fixed user used to execute cleanup
  CLEANUP_USER_NAME: "root"

  # If root is not found in users.json, you can pass the token here (optional)
  # ROOT_TOKEN: "root-auth=1-14-...."   # Plaintext is not recommended; use a Secret if needed

  # Process only one ticket per iteration to avoid concurrent conflicts
  PER_PAGE: "1"
  PICK_TICKET_MODE: "first"
  DEFAULT_ORDERBY: "LastUpdated"
  DEFAULT_ORDER: "DESC"

  MAX_DELETES_PER_ITER: "1"
  DELETE_RATIO: "1.0"
  DRY_RUN: "false"

  # Safety valve: only clean up load-test tickets
  VERIFY_BEFORE_ACTION: "true"
  SUBJECT_MUST_PREFIX: "k6-"

  # Optional: only clean up older tickets to avoid deleting freshly created ones (recommended for production runs)
  OLDER_THAN: "" # e.g. "-30 minutes" / "-2 hours"

  # ===== Key: cleanup action =====
  # Recommended: do not use REST2 DELETE; use PUT Status=deleted instead (more stable)
  DELETE_METHOD: "put_status" # put_status | delete
  DELETE_STATUS: "deleted"

  # If you still want to keep "resolve first, then delete", keep the following settings (optional)
  RESOLVE_BEFORE_DELETE: "true"
  TARGET_RESOLVE_STATUS: "resolved"
  RESOLVE_TWO_STEP_FOR_NEW: "true"
  INTERMEDIATE_STATUS_FOR_NEW: "open"

  # TicketSQL: do not restrict resolved; let S5 advance it by itself
  TICKETSQL_TEMPLATES: |-
    [
      "Queue='Traffic' AND Subject LIKE 'k6-%' AND Status!='deleted' ORDER BY LastUpdated DESC"
    ]

  # Thresholds
  TH_ENABLE: "true"
  TH_FAIL_RATE_MAX: "0.01"
  TH_P95_MS_MAX: "4500"
  TH_SEARCH_P95_MS: "0"
  TH_GET_P95_MS: "0"
  TH_PUT_P95_MS: "0"
  TH_DELETE_P95_MS: "0"
