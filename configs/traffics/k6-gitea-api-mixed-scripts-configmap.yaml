apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-gitea-api-mix-scripts
  namespace: traffic
data:
  api_mix.js: |
    // api_mix.js - Gitea API Mixed Workload Entry
    //
    // - initContainer should copy the five scenario scripts to:
    //   /scripts/auth/  /scripts/browse/  /scripts/gitdata/  /scripts/review/  /scripts/issues/
    // - This entry script will be copied to /scripts/api_mix.js
    // - The main container will execute: k6 run /scripts/api_mix.js
    //
    // mixed strategy:
    // - using  k6 multi-scenario: alloc scenario with weight W_* and VUs accordingly

    import auth, { setup as setupAuth } from "./auth/api_auth.js";
    import browse, { setup as setupBrowse } from "./browse/api_browse.js";
    import gitdata, { setup as setupGitdata } from "./gitdata/api_gitdata.js";
    import review, { setup as setupReview } from "./review/api_review.js";
    import issues, { setup as setupIssues } from "./issues/api_issues.js";

    // ============================
    // Helpers
    // ============================
    function toNum(v, def) {
      const n = Number(v);
      return Number.isFinite(n) ? n : def;
    }

    // ensure sum(vus) = totalVus
    // - weight=0 => disabled scenario => 0 VU
    // - when totalVus < enabled scenarios: give 1 VU only to the top totalVus scenarios
    function buildWeightedVus(totalVus, weights) {
      const keys = Object.keys(weights).filter((k) => weights[k] > 0);
      if (totalVus <= 0 || keys.length === 0) return {};

      // if totalVus is too small: sort by weight and assign 1 VU to the top N scenarios
      if (totalVus < keys.length) {
        const sorted = [...keys].sort((a, b) => weights[b] - weights[a]);
        const outSmall = {};
        for (const k of sorted) outSmall[k] = 0;
        for (let i = 0; i < totalVus; i++) outSmall[sorted[i]] = 1;
        return outSmall;
      }

      const sum = keys.reduce((a, k) => a + weights[k], 0);
      if (!sum) return {};

      const out = {};
      let used = 0;

      for (const k of keys) {
        const vus = Math.floor((totalVus * weights[k]) / sum);
        out[k] = vus;
        used += vus;
      }

      // allocate remaining VUs to the highest-weighted scenarios (if totalVus is not perfectly divisible)
      let left = totalVus - used;
      const keysByWeight = [...keys].sort((a, b) => weights[b] - weights[a]);
      let idx = 0;
      while (left > 0) {
        out[keysByWeight[idx % keysByWeight.length]] += 1;
        left -= 1;
        idx += 1;
      }

      // ensure each enabled scenario has at least 1 VU (at this point, totalVus >= the number of enabled scenarios)
      for (const k of keys) {
        if (out[k] < 1) out[k] = 1;
      }

      // if "at least 1" causes an overflow, start deducting from the lowest-weighted scenarios (until sum = totalVus)
      let totalNow = keys.reduce((a, k) => a + (out[k] || 0), 0);
      if (totalNow > totalVus) {
        const keysByLowWeight = [...keys].sort((a, b) => weights[a] - weights[b]);
        let over = totalNow - totalVus;
        let j = 0;
        while (over > 0 && j < keysByLowWeight.length) {
          const k = keysByLowWeight[j];
          if (out[k] > 1) {
            out[k] -= 1;
            over -= 1;
          } else {
            j += 1;
          }
        }
      }

      return out;
    }

    // ============================
    // ENV (mix-level)
    // ============================
    const INSECURE_TLS = (__ENV.INSECURE_TLS === "true");
    const DURATION = __ENV.DURATION || "10m";

    // Total concurrency: prefer TOTAL_VUS; fall back to VUS if unset (compatible with single-scenario jobs)
    const TOTAL_VUS = toNum(__ENV.TOTAL_VUS, toNum(__ENV.VUS, 10));

    // Weights (recommended default: 5/30/30/20/15)
    const W_AUTH = toNum(__ENV.W_AUTH, 5);
    const W_BROWSE = toNum(__ENV.W_BROWSE, 30);
    const W_GITDATA = toNum(__ENV.W_GITDATA, 30);
    const W_REVIEW = toNum(__ENV.W_REVIEW, 20);
    const W_ISSUES = toNum(__ENV.W_ISSUES, 15);

    // Global thresholds (single guardrail at the entry point; sub-scripts can also read the same env names)
    const TH_FAIL_RATE_MAX = String(__ENV.TH_FAIL_RATE_MAX || "0.05");
    const TH_P95_MS_MAX = String(__ENV.TH_P95_MS_MAX || "3000");
    const TH_CHECKS_MIN = String(__ENV.TH_CHECKS_MIN || "0.95");

    const weights = {
      api_auth: W_AUTH,
      api_browse: W_BROWSE,
      api_gitdata: W_GITDATA,
      api_review: W_REVIEW,
      api_issues: W_ISSUES,
    };

    const vusMap = buildWeightedVus(TOTAL_VUS, weights);

    // Print allocation results at startup for easy verification
    console.log(
      "[api-mix] TOTAL_VUS=" + TOTAL_VUS +
      " weights=" + JSON.stringify(weights) +
      " vusMap=" + JSON.stringify(vusMap) +
      " duration=" + DURATION
    );

    // ============================
    // k6 options (multi-scenario)
    // ============================
    const scenarios = {};

    if (vusMap.api_auth) {
      scenarios.api_auth = {
        executor: "constant-vus",
        vus: vusMap.api_auth,
        duration: DURATION,
        exec: "api_auth",
        gracefulStop: "10s",
        // Optional: clearer scenario tagging (avoids any undefined nameTag issues)
        tags: { name: "api_auth" },
      };
    }

    if (vusMap.api_browse) {
      scenarios.api_browse = {
        executor: "constant-vus",
        vus: vusMap.api_browse,
        duration: DURATION,
        exec: "api_browse",
        gracefulStop: "10s",
        tags: { name: "api_browse" },
      };
    }

    if (vusMap.api_gitdata) {
      scenarios.api_gitdata = {
        executor: "constant-vus",
        vus: vusMap.api_gitdata,
        duration: DURATION,
        exec: "api_gitdata",
        gracefulStop: "10s",
        tags: { name: "api_gitdata" },
      };
    }

    if (vusMap.api_review) {
      scenarios.api_review = {
        executor: "constant-vus",
        vus: vusMap.api_review,
        duration: DURATION,
        exec: "api_review",
        gracefulStop: "10s",
        tags: { name: "api_review" },
      };
    }

    if (vusMap.api_issues) {
      scenarios.api_issues = {
        executor: "constant-vus",
        vus: vusMap.api_issues,
        duration: DURATION,
        exec: "api_issues",
        gracefulStop: "10s",
        tags: { name: "api_issues" },
      };
    }

    export const options = {
      insecureSkipTLSVerify: INSECURE_TLS,
      scenarios: scenarios,
      thresholds: {
        http_req_failed: ["rate<" + TH_FAIL_RATE_MAX],
        http_req_duration: ["p(95)<" + TH_P95_MS_MAX],
        checks: ["rate>" + TH_CHECKS_MIN],
      },
    };

    // ============================
    // setup: reuse the setup() function from all five scripts (runs only once globally)
    // ============================
    export function setup() {
      return {
        auth: setupAuth ? setupAuth() : null,
        browse: setupBrowse ? setupBrowse() : null,
        gitdata: setupGitdata ? setupGitdata() : null,
        review: setupReview ? setupReview() : null,
        issues: setupIssues ? setupIssues() : null,
      };
    }

    // ============================
    // Scenario execution functions
    // ============================
    export function api_auth(data) {
      return auth(data && data.auth);
    }

    export function api_browse(data) {
      return browse(data && data.browse);
    }

    export function api_gitdata(data) {
      return gitdata(data && data.gitdata);
    }

    export function api_review(data) {
      return review(data && data.review);
    }

    export function api_issues(data) {
      return issues(data && data.issues);
    }
