# =========================================================
# Job: k6-gitea-api-review-job
# ConfigMap: k6-gitea-api-review
# Script: /scripts/api_review.js
# Namespace: traffic
# =========================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-gitea-api-review-job
  namespace: traffic
  labels:
    app: k6-gitea
    k6-scope: api
    k6-class: review
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          imagePullPolicy: IfNotPresent
          command: ["k6", "run", "/scripts/api_review.js"]
          env:
            - name: BASE_URL
              value: "https://gitea.example.com"
            - name: INSECURE_TLS
              value: "true"
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k6-gitea-secret
                  key: token
            - name: OWNER
              value: "nixwl"
            - name: REPO
              value: "tquic"

            - name: VUS
              value: "1"
            - name: DURATION
              value: "30s"
            - name: SLEEP_SECONDS
              value: "1"

            - name: PAGES
              value: "2"
            - name: PER_PAGE
              value: "20"
            - name: ENABLE_DETAIL
              value: "true"

            - name: ENABLE_REVIEWS
              value: "true"
            - name: ENABLE_REVIEW_COMMENTS
              value: "true"
            # Enable this if you want to include regular PR comments in the read load test
            - name: ENABLE_ISSUE_COMMENTS
              value: "false"

            - name: THRESH_FAIL_RATE
              value: "0.01"
            - name: THRESH_P95_MS
              value: "1200"
            - name: THRESH_CHECK_RATE
              value: "0.99"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: k6-gitea-api-review-script
