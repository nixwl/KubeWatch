apiVersion: batch/v1
kind: Job
metadata:
  name: k6-zot-manifest-job
  namespace: traffic
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: zot.example.com/mirror/ghcr.io/grafana/k6
          command: ["k6", "run", "/scripts/manifest.js"]
          env:
            - name: BASE_URL
              value: "https://zot.example.com"
            - name: INSECURE_TLS
              value: "true"
            - name: ZOT_USER
              valueFrom: { secretKeyRef: { name: k6-zot-secret, key: username } }
            - name: ZOT_PASS
              valueFrom: { secretKeyRef: { name: k6-zot-secret, key: password } }
            - name: ITERATIONS
              value: "5"
            - name: REPO
              value: "mirror/docker.io/library/nginx"
            - name: TAG
              value: "1.27"
            - name: MANIFEST_GET_PCT
              value: "100"
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "700m", memory: "512Mi" }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          projected:
            sources:
              - configMap: { name: k6-zot-lib,      items: [{ key: lib.js,      path: lib.js }] }
              - configMap: { name: k6-zot-manifest, items: [{ key: manifest.js, path: manifest.js }] }
