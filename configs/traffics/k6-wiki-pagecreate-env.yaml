apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-wiki-pagecreate-env
  namespace: traffic
data:
  # ========= Target =========
  BASE_URL: "https://wiki.example.com"
  GRAPHQL_PATH: "/graphql"
  INSECURE_TLS: "true"

  # ========= User model (stable online users) =========
  # Create is a write operation, so a smaller VUS is recommended
  VUS: "1"
  DURATION: "3m"

  # ========= Human pacing =========
  THINK_MIN_MS: "800"
  THINK_MAX_MS: "3000"

  # ========= Create scope (isolate k6 pages) =========
  # Final page.path = <CREATE_PREFIX>/<RUN_ID>/<slug>
  CREATE_PREFIX: "k6/create"

  # Optional: manually set the RUN_ID for this run (useful for precise cleanup later)
  # If empty, the script generates one automatically and prints it to the log
  CREATE_RUN_ID: ""

  # Maximum number of pages each VU may create, to avoid pollution / overgrowth
  LIMIT_PER_VU: "10"

  # ========= Page fields =========
  LOCALE: "en"
  EDITOR: "markdown"
  IS_PUBLISHED: "true"
  IS_PRIVATE: "false"

  TITLE_PREFIX: "k6 created"

  # Approximate generated content size, used to simulate different write sizes
  CONTENT_KB: "2"

  # Tags (CSV); the script automatically appends runId / vu information
  TAGS_CSV: "k6,loadtest,create"

  # ========= HTTP =========
  TIMEOUT: "30s"

  # ========= Thresholds =========
  FAIL_RATE_MAX: "0.01"
  P95_MS_MAX: "10000"
