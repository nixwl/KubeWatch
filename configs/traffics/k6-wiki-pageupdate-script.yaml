apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-wiki-pageupdate-script
  namespace: traffic
data:
  page_update.js: |
    import http from "k6/http";
    import { check, sleep, fail } from "k6";

    function mustEnv(name) {
      const v = (__ENV[name] || "").trim();
      if (!v) fail(`missing env: ${name}`);
      return v;
    }
    function normBaseUrl(u) { return u.endsWith("/") ? u.slice(0, -1) : u; }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function asBool(v, defVal=false) {
      const s = String(v ?? "").trim().toLowerCase();
      if (s === "true") return true;
      if (s === "false") return false;
      return defVal;
    }

    const BASE_URL = normBaseUrl(mustEnv("BASE_URL"));
    const WIKI_TOKEN = mustEnv("WIKI_TOKEN");

    const GRAPHQL_PATH = String(__ENV.GRAPHQL_PATH || "/graphql").trim();
    const INSECURE_TLS = asBool(__ENV.INSECURE_TLS, false);

    const VUS = Number(__ENV.VUS || 1);
    const DURATION = String(__ENV.DURATION || "5m");

    const THINK_MIN_MS = Number(__ENV.THINK_MIN_MS || 2000);
    const THINK_MAX_MS = Number(__ENV.THINK_MAX_MS || 8000);

    // === mixed-mode: allow update to start even when pool is empty at setup ===
    const UPDATE_DYNAMIC_DISCOVER = String(__ENV.UPDATE_DYNAMIC_DISCOVER || "true").trim() === "true";
    const UPDATE_DISCOVER_EVERY = Number(__ENV.UPDATE_DISCOVER_EVERY || 5);

    // === CRITICAL scope guard ===
    const PATH_PREFIX = String(__ENV.PATH_PREFIX || "k6/create/").trim();

    // === CRITICAL k6-create fingerprint ===
    const REQUIRE_TAG = String(__ENV.REQUIRE_TAG || "k6").trim();
    const REQUIRE_DESCRIPTION = String(__ENV.REQUIRE_DESCRIPTION || "k6 create load test page").trim();
    const REQUIRE_CONTENT_SUBSTR = String(__ENV.REQUIRE_CONTENT_SUBSTR || "generated by k6 write-load scenario").trim();

    const TIMEOUT = String(__ENV.TIMEOUT || "30s").trim();
    const FAIL_RATE_MAX = Number(__ENV.FAIL_RATE_MAX || 0.01);
    const P95_MS_MAX = Number(__ENV.P95_MS_MAX || 2000);

    const PATCH_MARKER_START = String(__ENV.PATCH_MARKER_START || "<!-- k6-patch:start -->");
    const PATCH_MARKER_END = String(__ENV.PATCH_MARKER_END || "<!-- k6-patch:end -->");

    // Candidate tags subfields (may vary by Wiki.js version/customization)
    const TAG_SUBFIELD_CANDIDATES = String(__ENV.TAG_SUBFIELD_CANDIDATES || "tag,name,title,label")
      .split(",")
      .map(s => s.trim())
      .filter(Boolean);

    export const options = {
      insecureSkipTLSVerify: INSECURE_TLS,
      scenarios: {
        s4a_page_update: {
          executor: "constant-vus",
          vus: VUS,
          duration: DURATION,
          gracefulStop: "30s",
        },
      },
      thresholds: {
        http_req_failed: [`rate<${FAIL_RATE_MAX}`],
        http_req_duration: [`p(95)<${P95_MS_MAX}`],
        checks: ["rate>0.99"],
      },
    };

    function postGraphQL(query, variables, tags) {
      const url = `${BASE_URL}${GRAPHQL_PATH}`;
      const payload = JSON.stringify({ query, variables: variables || {} });

      const res = http.post(url, payload, {
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${WIKI_TOKEN}`,
          "User-Agent": "k6-wikijs-s4a-page-update",
        },
        tags,
        timeout: TIMEOUT,
      });

      if (res.status !== 200) {
        console.error(`[http!=200] status=${res.status} body=${String(res.body || "").slice(0, 300)}`);
      }
      return res;
    }

    // For compatibility: do not use the PageOrderBy variable type; hard-code TITLE instead (verified by your curl)
    const Q_LIST = `
      query {
        pages { list(orderBy: TITLE) { id path title } }
      }
    `;

    function buildQSingle(tagField) {
      // ✅ FIX: tags is [PageTag]!, so a subfield must be selected: tags { tagField }
      return `
        query PageSingle($id: Int!) {
          pages {
            single(id: $id) {
              id path title
              description
              content
              editor
              isPublished
              isPrivate
              locale
              tags { ${tagField} }
              updatedAt
            }
          }
        }
      `;
    }

    const M_UPDATE = `
      mutation PageUpdate(
        $id: Int!,
        $title: String!,
        $content: String!,
        $description: String!,
        $editor: String!,
        $isPublished: Boolean!,
        $isPrivate: Boolean!,
        $locale: String!,
        $tags: [String]!
      ) {
        pages {
          update(
            id: $id,
            title: $title,
            content: $content,
            description: $description,
            editor: $editor,
            isPublished: $isPublished,
            isPrivate: $isPrivate,
            locale: $locale,
            tags: $tags
          ) {
            responseResult { succeeded errorCode message slug }
            page { id path title }
          }
        }
      }
    `;

    function filterPoolByPath(pages) {
      let out = (pages || []).filter((p) => p && typeof p.id === "number" && typeof p.path === "string");
      if (PATH_PREFIX) out = out.filter((p) => p.path.startsWith(PATH_PREFIX));
      return out;
    }

    function extractTagStrings(tags, tagField) {
      // tags may look like: ["k6","x"] or [{tag:"k6"}, ...] or [{name:"k6"}, ...]
      if (!Array.isArray(tags)) return [];
      const out = [];
      for (const t of tags) {
        if (typeof t === "string") {
          if (t.trim()) out.push(t.trim());
          continue;
        }
        if (t && typeof t === "object") {
          const v = t[tagField];
          if (typeof v === "string" && v.trim()) out.push(v.trim());
        }
      }
      // Deduplicate
      return Array.from(new Set(out));
    }

    function isK6CreatePage(page, tagField) {
      // 1) hard path guard
      if (PATH_PREFIX && !(String(page?.path || "").startsWith(PATH_PREFIX))) return false;

      // 2) hard fingerprint guards
      if (REQUIRE_DESCRIPTION && String(page?.description || "") !== REQUIRE_DESCRIPTION) return false;

      if (REQUIRE_TAG) {
        const tagsStr = extractTagStrings(page?.tags, tagField);
        if (!tagsStr.includes(REQUIRE_TAG)) return false;
      }

      if (REQUIRE_CONTENT_SUBSTR) {
        const content = String(page?.content || "");
        if (!content.includes(REQUIRE_CONTENT_SUBSTR)) return false;
      }

      return true;
    }

    function patchContentKeepBounded(original, pageMeta) {
      const now = new Date().toISOString();
      const patchBlock =
        `${PATCH_MARKER_START}\n` +
        `LastSaved: ${now}\n` +
        `Target: ${pageMeta.path}\n` +
        `${PATCH_MARKER_END}\n`;

      const s = String(original ?? "");
      const startIdx = s.indexOf(PATCH_MARKER_START);
      const endIdx = s.indexOf(PATCH_MARKER_END);

      if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
        const before = s.slice(0, startIdx);
        const after = s.slice(endIdx + PATCH_MARKER_END.length);
        return `${before}${patchBlock}${after}`;
      }
      return s.length ? `${s}\n\n${patchBlock}` : patchBlock;
    }

    function detectTagSubfield(probeId) {
      // Try tags subfields one by one until a usable one is found
      for (const f of TAG_SUBFIELD_CANDIDATES) {
        const q = buildQSingle(f);
        const r = postGraphQL(q, { id: probeId }, { api: "wikijs", op: "pages.single", scenario: "s4a", phase: "setup-probe", tagField: f });

        const ok = (r.status === 200) && (() => { try { return !r.json().errors; } catch (_) { return false; } })();
        if (ok) {
          console.log(`[setup] detected tags subfield="${f}"`);
          return f;
        }
      }
      fail(`setup: cannot detect usable tags subfield. Tried: ${TAG_SUBFIELD_CANDIDATES.join(",")}. Check schema: pages.single.tags { ? }`);
    }

    export function setup() {
      const res = postGraphQL(
        Q_LIST,
        {},
        { api: "wikijs", op: "pages.list", scenario: "s4a", phase: "setup" }
      );

      const ok = check(res, {
        "setup: http 200": (r) => r.status === 200,
        "setup: no gql errors": (r) => { try { return !r.json().errors; } catch (_) { return false; } },
        "setup: pages.list[]": (r) => { try { return Array.isArray(r.json().data?.pages?.list); } catch (_) { return false; } },
      });
      if (!ok) fail(`setup(list) failed: status=${res.status}, body=${(res.body || "").slice(0, 500)}`);

      const list = res.json().data.pages.list || [];
      const pool = filterPoolByPath(list);

      if (!pool.length) {
        console.warn(`setup: empty pool after PATH_PREFIX='${PATH_PREFIX}'. Update will wait/discover during iterations (UPDATE_DYNAMIC_DISCOVER=${UPDATE_DYNAMIC_DISCOVER}).`);
        return { pool: [], tagField: "" };
      }

      // Use pool[0] to probe the tags subfield
      const tagField = detectTagSubfield(pool[0].id);

      return { pool, tagField };
    }

    export default function (data) {
      // setup() returns a snapshot; in mixed mode create may run after setup, so update must be able to discover.
      let pool = (data && data.pool) ? data.pool : [];
      let tagField = (data && data.tagField) ? data.tagField : "";

      // (A) Discover/refresh pool periodically (or when empty)
      if (UPDATE_DYNAMIC_DISCOVER && (!pool.length || !tagField || (((__ITER || 0) % UPDATE_DISCOVER_EVERY) === 0))) {
        const r0 = postGraphQL(
          Q_LIST,
          {},
          { api: "wikijs", op: "pages.list", scenario: "s4a", phase: "discover" }
        );
        try {
          if (r0 && r0.status === 200 && !r0.json().errors) {
            const list0 = r0.json().data?.pages?.list || [];
            const pool0 = filterPoolByPath(list0);
            if (pool0.length) {
              pool = pool0;
              if (!tagField) tagField = detectTagSubfield(pool[0].id);
              // persist in this VU runtime copy
              data.pool = pool;
              data.tagField = tagField;
            }
          }
        } catch (_) { /* ignore */ }
      }

      // (B) If still empty, no-op
      if (!pool.length) {
        sleep(0.2);
        return;
      }
      if (!tagField) {
        tagField = detectTagSubfield(pool[0].id);
        data.tagField = tagField;
      }

      const p = pool[Math.floor(Math.random() * pool.length)];

      // 1) read current (with correct tags subfield)
      const r = postGraphQL(
        buildQSingle(tagField),
        { id: p.id },
        { api: "wikijs", op: "pages.single", scenario: "s4a", tagField }
      );

      const ok = check(r, {
        "http 200": (x) => x.status === 200,
        "no gql errors": (x) => { try { return !x.json().errors; } catch (_) { return false; } },
        "has pages.single": (x) => { try { return !!x.json().data?.pages?.single; } catch (_) { return false; } },
      });

      if (!ok) {
        sleep(randInt(THINK_MIN_MS, THINK_MAX_MS) / 1000);
        return;
      }

      const page = r.json().data.pages.single;

      // === HARD GUARD: never update non-k6-create pages ===
      if (!isK6CreatePage(page, tagField)) {
        sleep(randInt(THINK_MIN_MS, THINK_MAX_MS) / 1000);
        return;
      }

      // 2) patch content bounded
      const newContent = patchContentKeepBounded(page.content, page);

      // 3) normalize tags to [String] for mutation
      const tagStrings = extractTagStrings(page.tags, tagField);

      const vars = {
        id: page.id,
        title: page.title,
        content: newContent,
        description: page.description || "",
        editor: page.editor || "markdown",
        isPublished: (page.isPublished !== undefined ? page.isPublished : true),
        isPrivate: (page.isPrivate !== undefined ? page.isPrivate : false),
        locale: page.locale || "en",
        tags: tagStrings,
      };

      const u = postGraphQL(
        M_UPDATE,
        vars,
        { api: "wikijs", op: "pages.update", scenario: "s4a", tagField }
      );

      check(u, {
        "update http 200": (x) => x.status === 200,
        "update no gql errors": (x) => { try { return !x.json().errors; } catch (_) { return false; } },
        "update succeeded": (x) => { try { return x.json().data?.pages?.update?.responseResult?.succeeded === true; } catch (_) { return false; } },
      });

      sleep(randInt(THINK_MIN_MS, THINK_MAX_MS) / 1000);
    }
