apiVersion: batch/v1
kind: Job
metadata:
  name: k6-gitea-api-mixed-job
  namespace: traffic
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-gitea
        k6-scope: api
        k6-class: mixed
    spec:
      restartPolicy: Never

      initContainers:
        - name: assemble-scripts
          image: rancher/mirrored-library-busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              mkdir -p /scripts/auth /scripts/browse /scripts/gitdata /scripts/review /scripts/issues

              cp -a /cm/auth/.    /scripts/auth/
              cp -a /cm/browse/.  /scripts/browse/
              cp -a /cm/gitdata/. /scripts/gitdata/
              cp -a /cm/review/.  /scripts/review/
              cp -a /cm/issues/.  /scripts/issues/
              cp -a /cm/mix/. /scripts/

              echo "[assemble] list /scripts:"
              ls -lah /scripts
              echo "[assemble] list sub dirs:"
              ls -lah /scripts/auth /scripts/browse /scripts/gitdata /scripts/review /scripts/issues

              test -f /scripts/api_mix.js
              echo "[assemble] OK: /scripts/api_mix.js exists"

          volumeMounts:
            - name: scripts
              mountPath: /scripts

            - name: cm-auth
              mountPath: /cm/auth
              readOnly: true
            - name: cm-browse
              mountPath: /cm/browse
              readOnly: true
            - name: cm-gitdata
              mountPath: /cm/gitdata
              readOnly: true
            - name: cm-review
              mountPath: /cm/review
              readOnly: true
            - name: cm-issues
              mountPath: /cm/issues
              readOnly: true
            - name: cm-mix
              mountPath: /cm/mix
              readOnly: true

      containers:
        - name: k6
          image: grafana/k6:0.49.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              run_id="${JOB_NAME:-job}-${POD_NAME:-pod}-${ts}"

              mkdir -p /logs
              echo "[runner] run_id=${run_id}"
              echo "[runner] exporting to /logs"

              # The entry script must be at /scripts/api_mix.js
              k6 run /scripts/api_mix.js \
                --tag run_id="${run_id}" \
                --summary-export "/logs/summary-${run_id}.json" \
                2>&1 | tee "/logs/run-${run_id}.log"

          env:
            # Used to generate a unique filename (Downward API)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']

            # =========================
            # Base (all scripts)
            # =========================
            - name: BASE_URL
              value: "https://gitea.example.com"
            - name: INSECURE_TLS
              value: "true"

            # =========================
            # Secret (API Token)
            # =========================
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k6-gitea-secret
                  key: token

            # =========================
            # Target Repo
            # =========================
            - name: OWNER
              value: "nixwl"
            - name: REPO
              value: "tquic"

            # =========================
            # Mix (api_mix.js)
            # =========================
            - name: TOTAL_VUS
              value: "8"
            - name: VUS
              value: "8"
            - name: DURATION
              value: "10m"

            - name: W_AUTH
              value: "5"
            - name: W_BROWSE
              value: "30"
            - name: W_GITDATA
              value: "30"
            - name: W_REVIEW
              value: "20"
            - name: W_ISSUES
              value: "15"

            # =========================
            # Global behavior
            # =========================
            - name: SLEEP_SECONDS
              value: "1"
            - name: PAGES
              value: "2"
            - name: PER_PAGE
              value: "20"
            - name: ENABLE_DETAIL
              value: "true"

            # browse
            - name: ENABLE_COLLABORATORS
              value: "false"

            # gitdata
            - name: ENABLE_CONTENTS
              value: "true"
            - name: ENABLE_RAW
              value: "true"
            - name: REPO_FILE_PATH
              value: "README.md"
            - name: REF
              value: ""
            - name: RAW_REF_MODE
              value: "query"

            # review
            - name: ENABLE_REVIEWS
              value: "true"
            - name: ENABLE_REVIEW_COMMENTS
              value: "true"
            - name: ENABLE_ISSUE_COMMENTS
              value: "false"

            # issues
            - name: WRITE_RATIO
              value: "0.03"
            - name: CLEANUP
              value: "true"
            - name: TITLE_PREFIX
              value: "[k6]"

            # auth
            - name: ENABLE_USER_REPOS
              value: "false"

            # =========================
            # Thresholds
            # =========================
            - name: TH_FAIL_RATE_MAX
              value: "0.05"
            - name: TH_P95_MS_MAX
              value: "3000"
            - name: TH_CHECKS_MIN
              value: "0.95"

          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: k6-logs
              mountPath: /logs

      volumes:
        - name: scripts
          emptyDir: {}

        - name: k6-logs
          persistentVolumeClaim:
            claimName: k6-logs-pvc

        - name: cm-auth
          configMap:
            name: k6-gitea-api-auth-script
        - name: cm-browse
          configMap:
            name: k6-gitea-api-browse-script
        - name: cm-gitdata
          configMap:
            name: k6-gitea-api-gitdata-script
        - name: cm-review
          configMap:
            name: k6-gitea-api-review-script
        - name: cm-issues
          configMap:
            name: k6-gitea-api-issues-script
        - name: cm-mix
          configMap:
            name: k6-gitea-api-mix-scripts
