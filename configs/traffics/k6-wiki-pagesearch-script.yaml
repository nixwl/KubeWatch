apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-wiki-pagesearch-script
  namespace: traffic
data:
  page_search.js: |
    import http from "k6/http";
    import { check, sleep, fail } from "k6";

    function mustEnv(name) {
      const v = (__ENV[name] || "").trim();
      if (!v) fail(`missing env: ${name}`);
      return v;
    }
    function normBaseUrl(u) { return u.endsWith("/") ? u.slice(0, -1) : u; }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function getGqlErrors(r) {
      try {
        const j = r.json();
        const e = j && j.errors;
        if (e == null) return [];
        if (Array.isArray(e)) return e;
        if (typeof e === "string") return e.trim() ? [{ message: e }] : [];
        if (typeof e === "object") return Object.keys(e).length ? [e] : [];
        return [{ message: String(e) }];
      } catch (err) {
        return [{ message: `failed to parse JSON: ${String(err)}` }];
      }
    }
    function noGqlErrors(r) { return getGqlErrors(r).length === 0; }
    function summarizeGqlErrors(errs, limit = 3) {
      return errs.slice(0, limit).map((e) => e && (e.message || JSON.stringify(e))).join(" | ");
    }

    // ========= Required =========
    const BASE_URL = normBaseUrl(mustEnv("BASE_URL"));
    const WIKI_TOKEN = mustEnv("WIKI_TOKEN");

    // ========= Optional =========
    const GRAPHQL_PATH = (__ENV.GRAPHQL_PATH || "/graphql").trim();
    const INSECURE_TLS = String(__ENV.INSECURE_TLS || "false").toLowerCase() === "true";

    const VUS = Number(__ENV.VUS || 10);
    const DURATION = String(__ENV.DURATION || "10m");

    const THINK_MIN_MS = Number(__ENV.THINK_MIN_MS || 200);
    const THINK_MAX_MS = Number(__ENV.THINK_MAX_MS || 1200);

    const LOCALE = String(__ENV.LOCALE || "en").trim();
    const SEARCH_PATH = String(__ENV.SEARCH_PATH ?? "").trim();
    const RESULT_LIMIT = Number(__ENV.RESULT_LIMIT || 10);

    const TERMS_RAW = String(__ENV.SEARCH_TERMS || "home").trim();
    const TERMS = TERMS_RAW.split(",").map((s) => s.trim()).filter(Boolean);
    if (TERMS.length === 0) fail("SEARCH_TERMS is empty");

    const TIMEOUT = String(__ENV.TIMEOUT || "30s").trim();

    const FAIL_RATE_MAX = Number(__ENV.FAIL_RATE_MAX || 0.01);
    const P95_MS_MAX = Number(__ENV.P95_MS_MAX || 1500);

    export const options = {
      insecureSkipTLSVerify: INSECURE_TLS,
      scenarios: {
        s3_page_search: {
          executor: "constant-vus",
          vus: VUS,
          duration: DURATION,
          gracefulStop: "30s",
        },
      },
      thresholds: {
        http_req_failed: [`rate<${FAIL_RATE_MAX}`],
        http_req_duration: [`p(95)<${P95_MS_MAX}`],
        checks: ["rate>0.99"],
      },
    };

    function postGraphQL(query, tags) {
      const url = `${BASE_URL}${GRAPHQL_PATH}`;
      const payload = JSON.stringify({ query });
      return http.post(url, payload, {
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${WIKI_TOKEN}`,
          "User-Agent": "k6-wikijs-s3-page-search",
        },
        tags,
        timeout: TIMEOUT,
      });
    }

    function pickTerm() {
      return TERMS[Math.floor(Math.random() * TERMS.length)];
    }

    function esc(s) {
      return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n");
    }

    function buildSearchQuery(term) {
      // Reference shape for pages.search: search(path, locale, query) { results { ... } }
      // The limit field may vary by version; here we use results slicing to control response size (more compatible)
      return `{
        pages {
          search(path: "${esc(SEARCH_PATH)}", locale: "${esc(LOCALE)}", query: "${esc(term)}") {
            results {
              id
              title
              description
              path
              locale
            }
          }
        }
      }`;
    }

    export function setup() {
      const term = TERMS[0];
      const q = buildSearchQuery(term);
      const res = postGraphQL(q, { api: "wikijs", op: "pages.search", scenario: "s3", phase: "setup" });

      const ok = check(res, {
        "setup: http 200": (r) => r.status === 200,
        "setup: no gql errors": (r) => noGqlErrors(r),
        "setup: has pages.search.results": (r) => {
          try {
            const j = r.json();
            const arr = j.data && j.data.pages && j.data.pages.search && j.data.pages.search.results;
            return Array.isArray(arr);
          } catch (_) { return false; }
        },
      });

      if (!ok) {
        const errs = summarizeGqlErrors(getGqlErrors(res), 4);
        fail(`setup(search) failed: status=${res.status}, gqlErrors=${errs}, body=${(res.body || "").slice(0, 300)}`);
      }
    }

    export default function () {
      const term = pickTerm();
      const q = buildSearchQuery(term);
      const res = postGraphQL(q, { api: "wikijs", op: "pages.search", scenario: "s3" });

      check(res, {
        "http 200": (r) => r.status === 200,
        "no gql errors": (r) => noGqlErrors(r),
        "has pages.search.results": (r) => {
          try {
            const j = r.json();
            const arr = j.data && j.data.pages && j.data.pages.search && j.data.pages.search.results;
            return Array.isArray(arr);
          } catch (_) { return false; }
        },
      });

      sleep(randInt(THINK_MIN_MS, THINK_MAX_MS) / 1000);
    }
