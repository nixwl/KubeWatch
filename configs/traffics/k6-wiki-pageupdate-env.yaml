apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-wiki-pageupdate-env
  namespace: traffic
data:
  # ========= Target =========
  BASE_URL: "https://wiki.example.com"
  GRAPHQL_PATH: "/graphql"
  INSECURE_TLS: "true"

  # ========= User model =========
  VUS: "1"
  DURATION: "5m"

  # ========= Human pacing =========
  THINK_MIN_MS: "2000"
  THINK_MAX_MS: "8000"

  # ========= Scope (CRITICAL) =========
  # Must match the CREATE_PATH_PREFIX used by the create scenario
  PATH_PREFIX: "k6/create/"

  # ========= K6-create fingerprint (CRITICAL) =========
  # Only update pages that match all of these fingerprints (to avoid polluting real pages)
  REQUIRE_TAG: "k6"
  REQUIRE_DESCRIPTION: "k6 create load test page"
  REQUIRE_CONTENT_SUBSTR: "generated by k6 write-load scenario"

  # ========= HTTP =========
  TIMEOUT: "30s"

  # ========= Thresholds =========
  FAIL_RATE_MAX: "0.01"
  P95_MS_MAX: "2000"

  # ========= Update behavior =========
  PATCH_MARKER_START: "<!-- k6-patch:start -->"
  PATCH_MARKER_END: "<!-- k6-patch:end -->"
