# =========================================================
# Job: k6-gitea-api-issues-job
# ConfigMap: k6-gitea-api-issues
# Script: /scripts/api_issues.js
# Namespace: traffic
# ATTENTION：default CLEANUP=true
# =========================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-gitea-api-issues-job
  namespace: traffic
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-gitea
        k6-scope: api
        k6-class: issues
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          imagePullPolicy: IfNotPresent
          command: ["k6", "run", "/scripts/api_issues.js"]
          env:
            - name: BASE_URL
              value: "https://gitea.example.com"
            - name: INSECURE_TLS
              value: "true"

            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k6-gitea-secret
                  key: token
            - name: OWNER
              value: "nixwl"
            - name: REPO
              value: "tquic"
            - name: VUS
              value: "1"
            - name: DURATION
              value: "30s"
            - name: SLEEP_SECONDS
              value: "1"
            - name: PAGES
              value: "2"
            - name: PER_PAGE
              value: "20"
            - name: ENABLE_DETAIL
              value: "true"

            - name: WRITE_RATIO
              value: "0.05"
            - name: CLEANUP
              value: "true"
            - name: TITLE_PREFIX
              value: "[k6]"

            - name: THRESH_FAIL_RATE
              value: "0.01"
            - name: THRESH_P95_MS
              value: "1200"
            - name: THRESH_CHECK_RATE
              value: "0.99"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: k6-gitea-api-issues-script
