prometheusOperator:
  admissionWebhooks:
    annotations: {}
    caBundle: ""
    # configure cert-manager
    certManager:
      enabled: true
      issuerRef:
        name: monitor-ca-issuer
        kind: ClusterIssuer
        group: cert-manager.io
      admissionCert:
        duration: "43800h"
        revisionHistoryLimit: 3
    failurePolicy: "Fail"
    patch:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 1Gi
