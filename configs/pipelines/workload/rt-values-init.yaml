# rt-init-values.yaml (fresh init + auth token schema)

defaultPodOptions:
  automountServiceAccountToken: false
  nodeSelector:
    node-role: worker

configMaps:
  rt-siteconfig:
    enabled: true
    data:
      05-plugins.pm: |
        Plugin('RT::Authen::Token');
        Plugin('RT::Extension::REST2');

      10-db.pm: |
        Set($DatabaseType, 'Pg');
        Set($DatabaseHost, $ENV{'RT_DB_HOST'});
        Set($DatabasePort, $ENV{'RT_DB_PORT'});
        Set($DatabaseName, $ENV{'RT_DB_NAME'});
        Set($DatabaseUser, $ENV{'RT_DB_USER'});
        Set($DatabasePassword, $ENV{'RT_DB_PASSWORD'});

secrets:
  rt-env:
    enabled: true
    stringData:
      RT_DB_HOST: "pg-postgresql-primary.database.svc.cluster.local"
      RT_DB_PORT: "5432"
      RT_DB_NAME: "rt"
      RT_DB_USER: "rt"
      RT_DB_PASSWORD: "rt123!"
      RT_ROOT_PASSWORD: "root123!"

persistence:
  siteconfig:
    enabled: true
    type: configMap
    identifier: rt-siteconfig
    globalMounts:
      - path: /opt/rt/etc/RT_SiteConfig.d

  secrets:
    enabled: true
    type: secret
    identifier: rt-env
    globalMounts:
      - path: /run/secrets
        readOnly: true

controllers:
  main:
    enabled: true
    type: job
    job:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600

    containers:
      main:
        image:
          repository: quay.io/abh/rt
          tag: latest
          pullPolicy: IfNotPresent

        securityContext:
          readOnlyRootFilesystem: false
          runAsUser: 0
          runAsGroup: 0

        envFrom:
          - secretRef:
              identifier: rt-env

        command: ["sh", "-lc"]
        args:
          - |
            set -euo pipefail

            echo "[1/3] install deps..."
            apk add --no-cache perl-dbd-pg postgresql-client

            echo "[2/3] init RT core schema..."
            /opt/rt/sbin/rt-setup-database \
              --action init \
              --skip-create \
              --root-password-file /run/secrets/RT_ROOT_PASSWORD

            echo "[3/3] ensure RT::Authen::Token tables exist..."
            export PGPASSWORD="${RT_DB_PASSWORD}"

            psql -v ON_ERROR_STOP=1 \
              -h "${RT_DB_HOST}" -p "${RT_DB_PORT}" \
              -U "${RT_DB_USER}" -d "${RT_DB_NAME}" <<'SQL'
            CREATE SEQUENCE IF NOT EXISTS rtxauthtokens_id_seq;

            CREATE TABLE IF NOT EXISTS RTxAuthTokens (
              id            integer       DEFAULT nextval('rtxauthtokens_id_seq'),
              Owner         integer  NOT NULL DEFAULT 0,
              Token         varchar(256),
              Description   varchar(255) NOT NULL DEFAULT '',
              LastUsed      timestamp,
              Creator       integer  NOT NULL DEFAULT 0,
              Created       timestamp,
              LastUpdatedBy integer  NOT NULL DEFAULT 0,
              LastUpdated   timestamp,
              PRIMARY KEY (id)
            );

            CREATE INDEX IF NOT EXISTS RTxAuthTokensOwner ON RTxAuthTokens (Owner);

            SELECT 'OK: RTxAuthTokens ready' AS status;
            SQL

            echo "DONE."
