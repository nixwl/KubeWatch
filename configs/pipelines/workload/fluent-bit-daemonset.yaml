apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: init-buffers
          image: rancher/mirrored-library-busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p "/mnt/${NODE_NAME}/s3/pods" "/mnt/${NODE_NAME}/s3/node"
              chmod -R 0777 "/mnt/${NODE_NAME}" || true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: buffers
              mountPath: /mnt

      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.2.2
          imagePullPolicy: IfNotPresent

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: S3_BUCKET
              value: "k8s-logs"
            - name: S3_ENDPOINT
              value: "http://minio.database.svc.cluster.local:9000"
            - name: S3_REGION
              value: "us-east-1"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-fluentbit-s3-credentials
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-fluentbit-s3-credentials
                  key: MINIO_SECRET_KEY

          ports:
            - name: http-metrics
              containerPort: 2020

          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

          securityContext:
            runAsUser: 0
            privileged: true
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/

            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true

            # IMPORTANT: follow /var/log/pods symlink target
            - name: dockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

            - name: runlogjournal
              mountPath: /run/log/journal
              readOnly: true
            - name: varlogjournal
              mountPath: /var/log/journal
              readOnly: true
            - name: machineid
              mountPath: /etc/machine-id
              readOnly: true

            - name: devkmsg
              mountPath: /dev/kmsg
              readOnly: true

            - name: hostvarlog
              mountPath: /host/var/log
              readOnly: true

            - name: buffers
              mountPath: /buffers
              subPathExpr: $(NODE_NAME)

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: fluent-bit-config

        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory

        - name: dockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory

        - name: runlogjournal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
        - name: varlogjournal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        - name: machineid
          hostPath:
            path: /etc/machine-id
            type: File

        - name: devkmsg
          hostPath:
            path: /dev/kmsg
            type: CharDevice

        - name: hostvarlog
          hostPath:
            path: /var/log
            type: Directory

        - name: buffers
          persistentVolumeClaim:
            claimName: fluent-bit-logs

        - name: tmp
          emptyDir: {}
