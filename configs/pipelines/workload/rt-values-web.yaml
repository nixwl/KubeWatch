# rt-web-values.yaml (RT 4.4 + REST2 + Auth Token + working local.css mount)

global:
  rtFqdn: "rt.example.com"
  tlsSecret: "rt-general-tls"
  clusterIssuer: "producer-ca-issuer"

defaultPodOptions:
  automountServiceAccountToken: false
  nodeSelector:
    node-role: worker

configMaps:
  # ===== RT_SiteConfig.d =====
  rt-siteconfig:
    enabled: true
    data:
      # RT 4.4 must manually enable REST2 + Auth Token
      05-plugins.pm: |
        Plugin('RT::Authen::Token');
        Plugin('RT::Extension::REST2');

      10-db.pm: |
        Set($DatabaseType, 'Pg');
        Set($DatabaseHost, $ENV{'RT_DB_HOST'});
        Set($DatabasePort, $ENV{'RT_DB_PORT'});
        Set($DatabaseName, $ENV{'RT_DB_NAME'});
        Set($DatabaseUser, $ENV{'RT_DB_USER'});
        Set($DatabasePassword, $ENV{'RT_DB_PASSWORD'});

      20-web.pm: |
        # ===== Internal Listening Port (must match container/Service/Probe) =====
        Set($WebPort, ($ENV{'RT_WEB_PORT'} || 8000));

        # ===== WebPath: Root Path Must Use Empty String (Don't Use "/") =====
        Set($WebPath, "");

        # ===== Domain/Base URL (Read from env to Avoid Helm Template Not Rendered) =====
        Set($WebDomain, ($ENV{'RT_WEB_DOMAIN'} || 'rt.example.com'));
        Set($WebBaseURL, ($ENV{'RT_WEB_BASEURL'} || ('https://' . $WebDomain)));
        Set($WebURL, $WebBaseURL . "/");

        # Reverse Proxy / Ingress should enable
        Set($CanonicalizeRedirectURLs, 1);
        Set($CanonicalizeURLsInFeeds, 1);

        # 你走 https ingress，这里保持安全 cookie
        Set($WebSecureCookies, 1);

      # Relax the query timeout，forbid UI/REST2 being killed
      25-db-timeout.pm: |
        Set($DatabaseQueryTimeout, 120);

  # ===== RT static resources：local.css ( must be mounted at /opt/rt/local/static/css) =====
  rt-local-css:
    enabled: true
    data:
      local.css: |
        /* Fix Auth Token textarea too small */
        textarea, .ui-dialog textarea {
          width: 100% !important;
          min-width: 640px !important;
          height: 4em !important;
          font-family: monospace !important;
          font-size: 14px !important;
        }

secrets:
  rt-env:
    enabled: true
    stringData:
      # ===== DB =====
      RT_DB_HOST: "pg-postgresql-primary.database.svc.cluster.local"
      RT_DB_PORT: "5432"
      RT_DB_NAME: "rt"
      RT_DB_USER: "rt"
      RT_DB_PASSWORD: "rt123!"

      # ===== WEB =====
      RT_WEB_PORT: "8000"
      RT_WEB_DOMAIN: "rt.example.com"
      RT_WEB_BASEURL: "https://rt.example.com"

      # OPT: root password (for initialization)
      RT_ROOT_PASSWORD: "root123!"

persistence:
  # RT configuration
  siteconfig:
    enabled: true
    type: configMap
    identifier: rt-siteconfig
    globalMounts:
      - path: /opt/rt/etc/RT_SiteConfig.d

  # local.css mount dir
  localcss:
    enabled: true
    type: configMap
    identifier: rt-local-css
    globalMounts:
      - path: /opt/rt/local/static/css

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    containers:
      main:
        image:
          repository: quay.io/abh/rt
          tag: latest
          pullPolicy: IfNotPresent

        securityContext:
          readOnlyRootFilesystem: false
          runAsUser: 0
          runAsGroup: 0

        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 2Gi

        envFrom:
          - secretRef:
              identifier: rt-env

        command: ["sh", "-lc"]
        args:
          - |
            set -euo pipefail

            # 1) rmove Mason cache after plugins being enabled, to avoid stale cache issue (if any)
            rm -rf /opt/rt/var/mason_data/obj/* || true

            # 2) ensure Pg driver  exists (if image doesn't have it, it will try to install)
            if ! perl -MDBD::Pg -e '1' >/dev/null 2>&1; then
              apk add --no-cache perl-dbd-pg
            fi

            exec /opt/rt/sbin/rt-server

        probes:
          # probe using /NoAuth/
          startup:
            enabled: true
            type: HTTP
            spec:
              httpGet:
                path: /NoAuth/
                port: 8000
                httpHeaders:
                  - name: Host
                    value: rt.example.com
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 10
              failureThreshold: 120 # ~10min

          readiness:
            enabled: true
            type: HTTP
            spec:
              httpGet:
                path: /NoAuth/
                port: 8000
                httpHeaders:
                  - name: Host
                    value: rt.example.com
              initialDelaySeconds: 30
              periodSeconds: 5
              timeoutSeconds: 10
              failureThreshold: 12

          liveness:
            enabled: true
            type: HTTP
            spec:
              httpGet:
                path: /NoAuth/
                port: 8000
                httpHeaders:
                  - name: Host
                    value: rt.example.com
              initialDelaySeconds: 120
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 6

service:
  main:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 8000
        protocol: TCP
        targetPort: 8000

ingress:
  main:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: "producer-ca-issuer"
    hosts:
      - host: "rt.example.com"
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: 8000
    tls:
      - secretName: "rt-general-tls"
        hosts:
          - "rt.example.com"
