# Applies to: prometheus-node-exporter.prometheus.monitor.metricRelabelings
metricRelabelings:
  - sourceLabels: [__name__]
    regex: "go_.*|process_.*|promhttp_.*|node_scrape_collector_.*|node_time_.*|node_timex_.*|node_vmstat_.*|node_boot_time_seconds|node_forks_total|node_intr_total|node_procs_running|node_softnet_.*|node_schedstat_.*|node_pressure_.*|node_netstat_.*|node_network_receive_.*|node_network_transmit_.*|node_memory_.*|node_filesystem_.*|node_disk_.*|node_cpu_.*"
