    regex: "go_gc_duration_seconds_sum|go_gc_duration_seconds_count|go_memstats_heap_inuse_bytes|go_memstats_heap_sys_bytes|go_memstats_alloc_bytes_total|go_goroutines|go_threads|process_cpu_seconds_total|process_resident_memory_bytes|node_time_seconds|node_time_zone_offset_seconds|node_timex_offset_seconds|node_timex_sync_status|node_vmstat_pgfault|node_vmstat_pgmajfault|node_softnet_dropped_total|node_softnet_times_squeezed_total|node_softnet_backlog_len|node_softnet_processed_total|node_schedstat_running_seconds_total|node_schedstat_waiting_seconds_total|node_pressure_cpu_waiting_seconds_total|node_pressure_io_waiting_seconds_total|node_pressure_memory_waiting_seconds_total|node_netstat_Tcp_CurrEstab|node_netstat_Tcp_RetransSegs|node_netstat_TcpExt_TCPTimeouts|node_netstat_TcpExt_ListenDrops|node_netstat_Udp_InErrors|node_netstat_Udp_RcvbufErrors|node_network_receive_bytes_total|node_network_receive_packets_total|node_network_receive_drop_total|node_network_receive_errs_total|node_network_transmit_bytes_total|node_network_transmit_packets_total|node_network_transmit_drop_total|node_network_transmit_errs_total|node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_memory_MemFree_bytes|node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_Active_anon_bytes|node_memory_Inactive_anon_bytes|node_memory_Dirty_bytes|node_memory_Writeback_bytes|node_memory_AnonPages_bytes|node_memory_PageTables_bytes|node_memory_KernelStack_bytes|node_memory_SReclaimable_bytes|node_memory_Shmem_bytes|node_memory_Unevictable_bytes|node_memory_SUnreclaim_bytes|node_memory_Mlocked_bytes|node_memory_CommitLimit_bytes|node_memory_Committed_AS_bytes|node_filesystem_size_bytes|node_filesystem_avail_bytes|node_filesystem_files|node_filesystem_files_free|node_filesystem_readonly|node_filesystem_device_error|node_disk_io_time_seconds_total|node_disk_io_time_weighted_seconds_total|node_disk_read_bytes_total|node_disk_written_bytes_total|node_disk_reads_completed_total|node_disk_writes_completed_total|node_disk_read_time_seconds_total|node_disk_write_time_seconds_total|node_cpu_seconds_total"
    targetLabel: "drop_node_exporter_metric"
    replacement: "0"
    action: replace
  - sourceLabels: [drop_node_exporter_metric]
    regex: "1"
    action: drop
  - regex: "drop_node_exporter_metric"
    action: labeldrop
  - action: drop
    regex: 'go_.*|process_.*|promhttp_.*|node_scrape_collector.*'
    sourceLabels: [__name__]
  - action: drop
    regex: '.*_bucket$'
    sourceLabels: [__name__]
