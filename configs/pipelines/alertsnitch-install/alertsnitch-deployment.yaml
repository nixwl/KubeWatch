apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertsnitch
  namespace: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertsnitch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertsnitch
    spec:
      containers:
        - image: registry.gitlab.com/yakshaving.art/alertsnitch
          name: alertsnitch
          ports:
            - containerPort: 9567
              name: http
          env:
            - name: ALERTSNITCH_BACKEND
              value: mysql
            - name: ALERTSNITCH_DSN
              value: "alertsnitch:<database_password>@(edb1:3306)/alertsnitch"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9567
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/health
              port: 9567
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: alertsnitch
  namespace: monitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertsnitch
  ports:
    - name: http
      port: 9567
      targetPort: 9567
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertsnitch
  namespace: monitor
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  ingressClassName: "traefik"
  rules:
    - host: alertsnitch.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertsnitch
                port:
                  number: 9567
  tls:
    - hosts:
        - alertsnitch.example.com
      secretName: alertsnitch-tls
