apiVersion: v1
kind: ConfigMap
metadata:
  name: net-payload-template-pod-delay-configmap
  namespace: chaosblade
data:
  net-payload.yaml: |
    apiVersion: chaosblade.io/v1alpha1
    kind: ChaosBlade
    metadata:
      name: __BLADE_NAME__
      labels:
        app: chaosblade-pod-net-delay-payload
    spec:
      experiments:
        - scope: pod
          target: network
          action: delay
          desc: "pod-net DELAY pod=__TARGET_NS__/__POD_NAME__ time=__TIME_MS__ms offset=__OFFSET_MS__ms iface=__INTERFACE__"
          matchers:
            # k8s selectors
            - name: namespace
              value: ["__TARGET_NS__"]
            - name: names
              value: ["__POD_NAME__"]
            - name: labels
              value: ["__POD_LABELS__"]
            - name: evict-count
              value: ["__EVICT_COUNT__"]
            - name: evict-percent
              value: ["__EVICT_PERCENT__"]
            - name: waiting-time
              value: ["__WAITING_TIME__"]

            # delay params
            - name: interface
              value: ["__INTERFACE__"]
            - name: time
              value: ["__TIME_MS__"]
            - name: offset
              value: ["__OFFSET_MS__"]

            # optional filters
            - name: local-port
              value: ["__LOCAL_PORT__"]
            - name: remote-port
              value: ["__REMOTE_PORT__"]
            - name: destination-ip
              value: ["__DESTINATION_IP__"]
            - name: exclude-port
              value: ["__EXCLUDE_PORT__"]
            - name: exclude-ip
              value: ["__EXCLUDE_IP__"]

            # optional flags
            - name: force
              value: ["__FORCE__"]