# mem-payload-template.pod.spike.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mem-payload-template-pod-spike-configmap
  namespace: chaosblade
data:
  mem-payload.yaml: |
    apiVersion: chaosblade.io/v1alpha1
    kind: ChaosBlade
    metadata:
      name: __BLADE_NAME__
      labels:
        app: chaosblade-pod-mem-spike-payload
    spec:
      experiments:
        # [MOD] pod spike: inject mem load into a container inside the Pod
        - scope: container
          target: mem
          action: load
          desc: "container-mem SPIKE pod=__TARGET_NS__/__POD_NAME__ container=__CONTAINER_NAME__ to __MEM_PERCENT__% over __RAMP_SECONDS__s (mode=__MEM_MODE__)"
          matchers:
            - name: namespace
              value: ["__TARGET_NS__"]
            - name: names
              value: ["__POD_NAME__"]
            - name: container-names
              value: ["__CONTAINER_NAME__"]

            - name: mem-percent
              value: ["__MEM_PERCENT__"]
            - name: mode
              value: ["__MEM_MODE__"]

            # optional: only for mode=ram; script will remove if empty or mode!=ram
            - name: rate
              value: ["__MEM_RATE__"]

            - name: timeout
              value: ["__TIMEOUT__"]

            # optional: keep same style as pod-cpu spike; script will remove if empty
            - name: cgroup-root
              value: ["__CGROUP_ROOT__"]
