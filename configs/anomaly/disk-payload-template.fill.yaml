apiVersion: v1
kind: ConfigMap
metadata:
  name: disk-payload-template-fill-configmap
  namespace: chaosblade
data:
  disk-payload.yaml: |
    apiVersion: chaosblade.io/v1alpha1
    kind: ChaosBlade
    metadata:
      name: __BLADE_NAME__
      labels:
        app: chaosblade-disk-fill-payload
    spec:
      experiments:
        - scope: node
          target: disk
          action: fill
          desc: "node __TARGET_NODE__ disk fill path=__DISK_PATH__ selector(percent=__PERCENT__, reserveMB=__RESERVE_MB__, sizeMB=__SIZE_MB__) retain=__RETAIN_HANDLE__"
          matchers:
            - name: names
              value: ["__TARGET_NODE__"]

            # required
            - name: path
              value: ["__DISK_PATH__"]

            # choose ONE (script will remove unset '-')
            - name: percent
              value: ["__PERCENT__"]
            - name: reserve
              value: ["__RESERVE_MB__"]
            - name: size
              value: ["__SIZE_MB__"]

            # optional flag (script removes if not true)
            - name: retain-handle
              value: ["__RETAIN_HANDLE__"]

            # always set timeout
            - name: timeout
              value: ["__TIMEOUT__"]
