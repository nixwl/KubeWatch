apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-payload-pod-fail-job-runner
  namespace: chaosblade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-payload-pod-fail-job-runner
rules:
  - apiGroups: ["chaosblade.io"]
    resources: ["chaosblades"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-payload-pod-fail-job-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-payload-pod-fail-job-runner
subjects:
  - kind: ServiceAccount
    name: pod-payload-pod-fail-job-runner
    namespace: chaosblade
---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: pod-payload-pod-fail-job-
  namespace: chaosblade
  labels:
    app: pod-payload-pod-fail
    run_type: manual
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 12000
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: pod-payload-pod-fail
        run_type: manual
    spec:
      serviceAccountName: pod-payload-pod-fail-job-runner
      restartPolicy: Never
      containers:
        - name: runner
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pod-payload-env-pod-fail-configmap
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: payload
              mountPath: /payload
            - name: logs
              mountPath: /logs
          command: ["/scripts/run.sh"]
      volumes:
        - name: script
          configMap:
            name: pod-payload-script-pod-fail-configmap
            defaultMode: 0555
        - name: payload
          configMap:
            name: pod-payload-template-pod-fail-configmap
            defaultMode: 0444
        - name: logs
          persistentVolumeClaim:
            claimName: node-logs-pvc