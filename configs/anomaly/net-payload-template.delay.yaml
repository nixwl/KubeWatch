apiVersion: v1
kind: ConfigMap
metadata:
  name: net-payload-template-delay-configmap
  namespace: chaosblade
data:
  net-payload.yaml: |
    apiVersion: chaosblade.io/v1alpha1
    kind: ChaosBlade
    metadata:
      name: __BLADE_NAME__
      labels:
        app: chaosblade-net-delay-payload
    spec:
      experiments:
        - scope: node
          target: network
          action: delay
          desc: "node __TARGET_NODE__ network delay __TIME_MS__ms (offset __OFFSET_MS__ms) iface=__INTERFACE__"
          matchers:
            - name: names
              value: ["__TARGET_NODE__"]
            - name: interface
              value: ["__INTERFACE__"]
            - name: time
              value: ["__TIME_MS__"]
            - name: offset
              value: ["__OFFSET_MS__"]
            # optional filters (script will remove matcher blocks if env is empty/'-')
            - name: local-port
              value: ["__LOCAL_PORT__"]
            - name: remote-port
              value: ["__REMOTE_PORT__"]
            - name: destination-ip
              value: ["__DESTINATION_IP__"]
            - name: exclude-port
              value: ["__EXCLUDE_PORT__"]
            - name: exclude-ip
              value: ["__EXCLUDE_IP__"]
            # optional flags (script will remove if not true)
            - name: force
              value: ["__FORCE__"]
            - name: ignore-peer-port
              value: ["__IGNORE_PEER_PORT__"]
            # always set timeout
            - name: timeout
              value: ["__TIMEOUT__"]
