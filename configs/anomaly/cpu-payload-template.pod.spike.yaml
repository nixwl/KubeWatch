# cpu-payload-template.pod.spike.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpu-payload-template-pod-spike-configmap
  namespace: chaosblade
data:
  cpu-payload.yaml: |
    apiVersion: chaosblade.io/v1alpha1
    kind: ChaosBlade
    metadata:
      name: __BLADE_NAME__
      labels:
        app: chaosblade-pod-cpu-payload
    spec:
      experiments:
        # Apply CPU load to the container in the Pod so the Pod reaches its resource limit
        - scope: container
          target: cpu
          action: fullload
          desc: "container-cpu spike pod=__TARGET_NS__/__POD_NAME__ pod=__pod_NAME__ to __CPU_PERCENT__% over __CLIMB_TIME__s"
          matchers:
            - name: namespace
              value: ["__TARGET_NS__"]
            - name: names
              value: ["__POD_NAME__"]
            - name: container-names
              value: ["__CONTAINER_NAME__"]

            - name: cpu-percent
              value: ["__CPU_PERCENT__"]
            - name: climb-time
              value: ["__CLIMB_TIME__"]
            - name: timeout
              value: ["__TIMEOUT__"]
            
            - name: cgroup-root
              value: ["__CGROUP_ROOT__"]

            # optional choose ONE (script will remove if empty)
            - name: cpu-count
              value: ["__CPU_COUNT__"]
            - name: cpu-list
              value: ["__CPU_LIST__"]
