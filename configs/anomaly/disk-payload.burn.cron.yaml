apiVersion: v1
kind: ServiceAccount
metadata:
  name: disk-payload-burn-cron-runner
  namespace: chaosblade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: disk-payload-burn-cron-runner
rules:
  - apiGroups: ["chaosblade.io"]
    resources: ["chaosblades"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: disk-payload-burn-cron-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: disk-payload-burn-cron-runner
subjects:
  - kind: ServiceAccount
    name: disk-payload-burn-cron-runner
    namespace: chaosblade
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: disk-payload-burn-cron
  namespace: chaosblade
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # >= MAX_HOLD_SECONDS + TIMEOUT_PADDING + 120
      activeDeadlineSeconds: 12000
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: disk-payload-burn-cron-runner
          restartPolicy: Never
          containers:
            - name: runner
              image: bitnami/kubectl
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: disk-payload-env-burn-configmap
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: payload
                  mountPath: /payload
                - name: logs
                  mountPath: /logs
              command: ["/scripts/run.sh"]
          volumes:
            - name: script
              configMap:
                name: disk-payload-script-burn-configmap
                defaultMode: 0555
            - name: payload
              configMap:
                name: disk-payload-template-burn-configmap
                defaultMode: 0444
            - name: logs
              persistentVolumeClaim:
                claimName: node-logs-pvc