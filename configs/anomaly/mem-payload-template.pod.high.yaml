# mem-payload-template.pod.high.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mem-payload-template-pod-high-configmap
  namespace: chaosblade
data:
  mem-payload.yaml: |
    apiVersion: chaosblade.io/v1alpha1
    kind: ChaosBlade
    metadata:
      name: __BLADE_NAME__
      labels:
        app: chaosblade-pod-mem-high-payload
    spec:
      experiments:
        - scope: container
          target: mem
          action: load
          desc: "container-mem HIGH pod=__TARGET_NS__/__POD_NAME__ container=__CONTAINER_NAME__ (mode=__MEM_MODE__)"
          matchers:
            - name: namespace
              value: ["__TARGET_NS__"]
            - name: names
              value: ["__POD_NAME__"]
            - name: container-names
              value: ["__CONTAINER_NAME__"]
            - name: mem-percent
              value: ["__MEM_PERCENT__"]
            - name: reserve
              value: ["__RESERVE_MB__"]
            - name: mode
              value: ["__MEM_MODE__"]

            # optional: only active when mode=ram; the script removes it when mode!=ram or the value is empty
            - name: rate
              value: ["__MEM_RATE__"]

            - name: timeout
              value: ["__TIMEOUT__"]

            # [MOD] optional: keep the cgroup-root parameter, matching the pod-cpu pattern
            - name: cgroup-root
              value: ["__CGROUP_ROOT__"]
