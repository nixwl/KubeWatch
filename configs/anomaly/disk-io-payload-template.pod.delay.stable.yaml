apiVersion: v1
kind: ConfigMap
metadata:
  name: disk-io-payload-template-pod-delay-stable-configmap
  namespace: chaosblade
data:
  disk-io-payload.yaml: |
    apiVersion: chaosblade.io/v1alpha1
    kind: ChaosBlade
    metadata:
      name: __BLADE_NAME__
      labels:
        app: chaosblade-pod-io-payload
    spec:
      experiments:
        # Inject delay into I/O operations on the specified path via a FUSE sidecar (pure delay: no errno/random)
        - scope: pod
          target: pod
          action: IO
          desc: "pod-io delay stable pod=__TARGET_NS__/__POD_NAME__ labels=__POD_LABELS__ method=__IO_METHOD__ delay=__IO_DELAY_MS__ms percent=__IO_PERCENT__ path=__IO_PATH__"
          matchers:
            - name: namespace
              value: ["__TARGET_NS__"]

            # choose one (script will remove if empty)
            - name: names
              value: ["__POD_NAME__"]
            - name: labels
              value: ["__POD_LABELS__"]

            # optional filters
            - name: evict-count
              value: ["__EVICT_COUNT__"]
            - name: evict-percent
              value: ["__EVICT_PERCENT__"]
            - name: waiting-time
              value: ["__WAITING_TIME__"]

            # IO delay params
            - name: method
              value: ["__IO_METHOD__"]
            - name: delay
              value: ["__IO_DELAY_MS__"]
            - name: percent
              value: ["__IO_PERCENT__"]
            - name: path
              value: ["__IO_PATH__"]
