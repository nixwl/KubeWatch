apiVersion: v1
kind: ConfigMap
metadata:
  name: net-payload-script-pod-delay-configmap
  namespace: chaosblade
data:
  run.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
    RUN_ID="$(date +%Y%m%d%H%M%S)"

    : "${TARGET_NS:?TARGET_NS is required}"
    : "${POD_NAME:=}"

    : "${POD_LABELS:=-}"
    : "${EVICT_COUNT:=-}"
    : "${EVICT_PERCENT:=-}"
    : "${WAITING_TIME:=-}"

    : "${BLADE_NAME:=chaosblade-pod-net-delay-payload}"
    : "${CLEANUP:=true}"

    : "${DELAY_TIME_MS:?DELAY_TIME_MS is required (ms)}"
    : "${DELAY_OFFSET_MS:=0}"
    : "${INTERFACE:=eth0}"

    : "${DELAY_LOCAL_PORT:=-}"
    : "${DELAY_REMOTE_PORT:=-}"
    : "${DELAY_DESTINATION_IP:=-}"
    : "${DELAY_EXCLUDE_PORT:=-}"
    : "${DELAY_EXCLUDE_IP:=-}"

    : "${DELAY_FORCE:=false}"
    : "${DELAY_IGNORE_PEER_PORT:=false}"

    : "${DELAY_MIN_HOLD_SECONDS:=600}"
    : "${DELAY_MAX_HOLD_SECONDS:=1200}"
    : "${DELAY_TIMEOUT_PADDING:=30}"

    : "${TIMEOUT:=}"   # [ADD] Allow external TIMEOUT overrides directly (consistent with mem-high)
    : "${LOG_DIR:=/logs}"

    normalize_opt() {
      local v="${1:-}"
      v="$(printf '%s' "$v" | tr -d '[:space:]')"
      if [ -z "$v" ] || [ "$v" = "-" ]; then
        echo ""
      else
        echo "$v"
      fi
    }

    POD_NAME="$(normalize_opt "${POD_NAME}")"
    POD_LABELS="$(normalize_opt "${POD_LABELS}")"
    EVICT_COUNT="$(normalize_opt "${EVICT_COUNT}")"
    EVICT_PERCENT="$(normalize_opt "${EVICT_PERCENT}")"
    WAITING_TIME="$(normalize_opt "${WAITING_TIME}")"

    DELAY_LOCAL_PORT="$(normalize_opt "${DELAY_LOCAL_PORT}")"
    DELAY_REMOTE_PORT="$(normalize_opt "${DELAY_REMOTE_PORT}")"
    DELAY_DESTINATION_IP="$(normalize_opt "${DELAY_DESTINATION_IP}")"
    DELAY_EXCLUDE_PORT="$(normalize_opt "${DELAY_EXCLUDE_PORT}")"
    DELAY_EXCLUDE_IP="$(normalize_opt "${DELAY_EXCLUDE_IP}")"

    # [ADD] Check the ChaosBlade CRD scope (Cluster / Namespaced)
    CHAOSBLADE_SCOPE="$(kubectl get crd chaosblades.chaosblade.io -o jsonpath='{.spec.scope}' 2>/dev/null || echo "Cluster")"
    echo "ChaosBlade CRD scope: ${CHAOSBLADE_SCOPE}"

    if [[ "$CHAOSBLADE_SCOPE" == "Cluster" ]]; then
      KUBECTL_CMD="kubectl"
    else
      KUBECTL_CMD="kubectl -n ${NS}"
    fi

    mkdir -p "${LOG_DIR}"
    # [MOD] Make the by-label indicator in logs more accurate: only write labels when POD_NAME is empty
    TARGET_TAG="${POD_NAME:-labels}"
    LOG_FILE="${LOG_DIR}/pod-net-delay_${TARGET_NS}_${TARGET_TAG}_${BLADE_NAME}_${RUN_ID}.log"
    exec > >(tee -a "${LOG_FILE}") 2>&1

    JSON_FILE="${LOG_FILE%.log}.json"
    JSON_FIRST=1
    JSON_CLOSED=0
    echo "[" > "${JSON_FILE}"

    log() { printf '%s [%s] %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${RUN_ID}" "$*"; }

    json_close() {
      if [ "${JSON_CLOSED}" -eq 0 ]; then
        echo "]" >> "${JSON_FILE}"
        JSON_CLOSED=1
      fi
    }

    json_append_object() {
      local fp="$1"
      if [ "${JSON_FIRST}" -eq 0 ]; then echo "," >> "${JSON_FILE}"; fi
      cat "${fp}" >> "${JSON_FILE}"
      JSON_FIRST=0
    }

    is_uint() { [[ "$1" =~ ^[0-9]+$ ]]; }

    rand_between() {
      local min="$1" max="$2"
      local span=$((max - min + 1))
      echo $(( min + (RANDOM % span) ))
    }

    cleanup() {
      json_close || true
      if [ "${CLEANUP}" = "true" ]; then
        log "cleanup: deleting chaosblade ${BLADE_NAME} (scope=${CHAOSBLADE_SCOPE})"
        $KUBECTL_CMD delete chaosblades.chaosblade.io "${BLADE_NAME}" --ignore-not-found || true
        $KUBECTL_CMD wait --for=delete chaosblades.chaosblade.io/"${BLADE_NAME}" --timeout=60s >/dev/null 2>&1 || true
      fi
    }
    trap cleanup EXIT INT TERM

    remove_matcher_block() {
      # remove matcher block: "- name: xxx" + next "value: [...]"
      local key="$1" file="$2"
      sed "/- name: ${key}/{N;d;}" "${file}" > "${file}.tmp" && mv "${file}.tmp" "${file}"
    }

    validate_target() {
      if [ -n "${POD_NAME}" ]; then
        log "validating pod exists: ${TARGET_NS}/${POD_NAME}"
        if ! kubectl -n "${TARGET_NS}" get pod "${POD_NAME}" >/dev/null 2>&1; then
          log "ERROR: pod not found: ${TARGET_NS}/${POD_NAME}"
          exit 1
        fi
      else
        log "INFO: POD_NAME empty; will target by labels='${POD_LABELS}'"
      fi
    }

    apply_delay() {
      local HOLD_SECONDS="$1"
      local TIMEOUT_SECONDS="$2"
      local tmp
      tmp="$(mktemp)"

      sed \
        -e "s|__BLADE_NAME__|${BLADE_NAME}|g" \
        -e "s|__TARGET_NS__|${TARGET_NS}|g" \
        -e "s|__POD_NAME__|${POD_NAME}|g" \
        -e "s|__POD_LABELS__|${POD_LABELS}|g" \
        -e "s|__EVICT_COUNT__|${EVICT_COUNT}|g" \
        -e "s|__EVICT_PERCENT__|${EVICT_PERCENT}|g" \
        -e "s|__WAITING_TIME__|${WAITING_TIME}|g" \
        -e "s|__INTERFACE__|${INTERFACE}|g" \
        -e "s|__TIME_MS__|${DELAY_TIME_MS}|g" \
        -e "s|__OFFSET_MS__|${DELAY_OFFSET_MS}|g" \
        -e "s|__LOCAL_PORT__|${DELAY_LOCAL_PORT}|g" \
        -e "s|__REMOTE_PORT__|${DELAY_REMOTE_PORT}|g" \
        -e "s|__DESTINATION_IP__|${DELAY_DESTINATION_IP}|g" \
        -e "s|__EXCLUDE_PORT__|${DELAY_EXCLUDE_PORT}|g" \
        -e "s|__EXCLUDE_IP__|${DELAY_EXCLUDE_IP}|g" \
        -e "s|__FORCE__|${DELAY_FORCE}|g" \
        -e "s|__IGNORE_PEER_PORT__|${DELAY_IGNORE_PEER_PORT}|g" \
        -e "s|__TIMEOUT__|${TIMEOUT_SECONDS}|g" \
        /payload/net-payload.yaml > "${tmp}"

      # k8s selectors
      [ -z "${POD_NAME}" ]       && remove_matcher_block "names" "${tmp}"
      [ -z "${POD_LABELS}" ]     && remove_matcher_block "labels" "${tmp}"
      [ -z "${EVICT_COUNT}" ]    && remove_matcher_block "evict-count" "${tmp}"
      [ -z "${EVICT_PERCENT}" ]  && remove_matcher_block "evict-percent" "${tmp}"
      [ -z "${WAITING_TIME}" ]   && remove_matcher_block "waiting-time" "${tmp}"

      # optional net filters
      [ -z "${DELAY_LOCAL_PORT}" ]      && remove_matcher_block "local-port" "${tmp}"
      [ -z "${DELAY_REMOTE_PORT}" ]     && remove_matcher_block "remote-port" "${tmp}"
      [ -z "${DELAY_DESTINATION_IP}" ]  && remove_matcher_block "destination-ip" "${tmp}"
      [ -z "${DELAY_EXCLUDE_PORT}" ]    && remove_matcher_block "exclude-port" "${tmp}"
      [ -z "${DELAY_EXCLUDE_IP}" ]      && remove_matcher_block "exclude-ip" "${tmp}"

      # flags
      [ "${DELAY_FORCE}" != "true" ] && remove_matcher_block "force" "${tmp}"
      [ "${DELAY_IGNORE_PEER_PORT}" != "true" ] && remove_matcher_block "ignore-peer-port" "${tmp}"

      log "=============================================="
      log "POD NETWORK DELAY MODE (k8s yaml via CRD)"
      log "runner_ns=${NS}"
      log "target=${TARGET_NS}/${POD_NAME:-<by labels>}"
      log "labels='${POD_LABELS}'"
      log "iface=${INTERFACE} time=${DELAY_TIME_MS}ms offset=${DELAY_OFFSET_MS}ms"
      log "hold=${HOLD_SECONDS}s timeout=${TIMEOUT_SECONDS}s"
      log "ChaosBlade CRD scope: ${CHAOSBLADE_SCOPE}"
      log "log_file=${LOG_FILE}"
      log "=============================================="

      log "rendered manifest (first 220 lines):"
      nl -ba "${tmp}" | sed -n '1,220p'

      # [MOD] Use KUBECTL_CMD (works with Cluster scope)
      $KUBECTL_CMD delete chaosblades.chaosblade.io "${BLADE_NAME}" --ignore-not-found >/dev/null 2>&1 || true
      $KUBECTL_CMD wait --for=delete chaosblades.chaosblade.io/"${BLADE_NAME}" --timeout=60s >/dev/null 2>&1 || true

      local tmpjson tmpjson2
      tmpjson="$(mktemp)"
      $KUBECTL_CMD apply -f "${tmp}" -o json > "${tmpjson}"
      json_append_object "${tmpjson}"
      rm -f "${tmpjson}" || true

      for j in $(seq 1 30); do
        STATUS="$($KUBECTL_CMD get chaosblades.chaosblade.io "${BLADE_NAME}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")"
        if [ "${STATUS}" = "Running" ]; then
          log "status.phase=Running"
          break
        fi
        sleep 1
      done

      tmpjson2="$(mktemp)"
      $KUBECTL_CMD get chaosblades.chaosblade.io "${BLADE_NAME}" -o json > "${tmpjson2}"
      json_append_object "${tmpjson2}"
      rm -f "${tmpjson2}" || true

      rm -f "${tmp}" || true
    }

    # --- sanity checks ---
    for k in DELAY_TIME_MS DELAY_OFFSET_MS DELAY_MIN_HOLD_SECONDS DELAY_MAX_HOLD_SECONDS DELAY_TIMEOUT_PADDING; do
      if ! is_uint "${!k}"; then log "ERROR: ${k} must be uint, got '${!k}'"; exit 2; fi
    done
    if [ "${DELAY_MAX_HOLD_SECONDS}" -lt "${DELAY_MIN_HOLD_SECONDS}" ]; then
      log "ERROR: DELAY_MAX_HOLD_SECONDS < DELAY_MIN_HOLD_SECONDS"
      exit 2
    fi

    # At least one of names or labels
    if [ -z "${POD_NAME}" ] && [ -z "${POD_LABELS}" ]; then
      log "ERROR: POD_NAME empty AND POD_LABELS empty. Set at least one."
      exit 2
    fi

    # evict-count and evict-percent are mutually exclusive
    if [ -n "${EVICT_COUNT}" ] && [ -n "${EVICT_PERCENT}" ]; then
      log "ERROR: EVICT_COUNT and EVICT_PERCENT are both set. Please set only one."
      exit 2
    fi

    # exclude-port is mutually exclusive with local/remote-port
    if [ -n "${DELAY_EXCLUDE_PORT}" ] && { [ -n "${DELAY_LOCAL_PORT}" ] || [ -n "${DELAY_REMOTE_PORT}" ]; }; then
      log "ERROR: DELAY_EXCLUDE_PORT is set but DELAY_LOCAL_PORT/DELAY_REMOTE_PORT also set. They are mutually exclusive."
      exit 2
    fi

    validate_target

    if [ -n "${DELAY_HOLD_SECONDS:-}" ] && [ -n "${DELAY_HOLD_SECONDS// }" ]; then
      if ! is_uint "${DELAY_HOLD_SECONDS}"; then log "ERROR: DELAY_HOLD_SECONDS must be uint"; exit 2; fi
      HOLD="${DELAY_HOLD_SECONDS}"
    else
      HOLD="$(rand_between "${DELAY_MIN_HOLD_SECONDS}" "${DELAY_MAX_HOLD_SECONDS}")"
    fi

    # [ADD] Allow TIMEOUT to be overridden externally; otherwise use the original calculation
    if [ -n "${TIMEOUT}" ] && [ -n "$(normalize_opt "${TIMEOUT}")" ]; then
      TIMEOUT_SECONDS="$(normalize_opt "${TIMEOUT}")"
      if ! is_uint "${TIMEOUT_SECONDS}"; then log "ERROR: TIMEOUT must be uint"; exit 2; fi
      log "using env TIMEOUT=${TIMEOUT_SECONDS}s"
    else
      TIMEOUT_SECONDS=$((HOLD + DELAY_TIMEOUT_PADDING))
      log "calc TIMEOUT: hold=${HOLD}s + padding=${DELAY_TIMEOUT_PADDING}s => ${TIMEOUT_SECONDS}s"
    fi

    apply_delay "${HOLD}" "${TIMEOUT_SECONDS}"

    log "holding ${HOLD}s..."
    sleep "${HOLD}"

    log "finished; deleting blade now..."
    cleanup
    log "done"
